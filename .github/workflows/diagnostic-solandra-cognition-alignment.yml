name: Diagnostic — Solandra Cognition Alignment

on:
  push:
    branches:
      - diagnostic/solandra-cognition-alignment

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  diagnostic:
    name: Configured cognition paired diagnostic
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run paired configured-cognition diagnostic
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node --import tsx --test test/solandra-cognition-alignment-diagnostic.test.ts
