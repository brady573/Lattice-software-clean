name: Validation — Authenticated Cognitive Assistance

on:
  push:
    branches:
      - validation/authenticated-cognitive-assistance
    paths:
      - .github/workflows/authenticated-cognitive-assistance-validation.yml
      - validation/authenticated-cognitive-browser-proof.mjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lattice_auth_cog
        ports:
          - 55436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lattice_auth_cog"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout validation helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: validation/authenticated-cognitive-assistance
          persist-credentials: false

      - name: Checkout exact combined Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fd153b6a32408d2819947f752f2bac34d6b3641e
          path: product
          persist-credentials: false

      - name: Verify exact combined Product candidate
        working-directory: product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fd153b6a32408d2819947f752f2bac34d6b3641e"
          test "$(git rev-parse HEAD^{tree})" = "7976f2926213aa0a6f70c6a491f726fbacdca452"
          echo "COMBINED_CANDIDATE_VERIFIED=PASS"

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        working-directory: product
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: product
        run: npm run build

      - name: Focused accepted-surface regressions
        working-directory: product
        run: |
          node --import tsx --test \
            test/canonical-generalized-cognitive-assistance.test.ts \
            test/single-owner-hosted-authentication.test.ts \
            test/m3-capability-broker-user-model.test.ts \
            test/m8-authenticated-subject.test.ts \
            test/runtime-config.test.ts \
            test/solandra-authoritative-surface.test.ts

      - name: Repository test suite
        working-directory: product
        run: npm test

      - name: Repository standard gate
        working-directory: product
        run: npm run check

      - name: Combined source security and boundary audit
        working-directory: product
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const owner = readFileSync('src/auth/owner-access.ts', 'utf8');
          const index = readFileSync('src/index.ts', 'utf8');
          const ui = readFileSync('src/ui/solandra-authoritative-conversation-page.ts', 'utf8');
          const text = owner + '\n' + index + '\n' + ui;
          if (/LATTICE_OWNER_ACCESS_TOKEN\s*[:=]\s*["'][^"']+/u.test(text)) throw new Error('Hard-coded Owner credential-like assignment detected.');
          if (/[?&](?:token|access[_-]?key)=/iu.test(text)) throw new Error('Credential-like URL query parameter detected.');
          if (/localStorage\.(?:setItem|getItem)\([^)]*owner-access/iu.test(text)) throw new Error('Owner credential stored in localStorage.');
          if (!ui.includes('window.ownerFetch("/api/v1/capabilities/user-model")')) throw new Error('Cognitive status call does not cross authenticated wrapper.');
          if (!ui.includes('window.ownerFetch("/api/v1/capabilities/user-model/connect"')) throw new Error('Cognitive grant call does not cross authenticated wrapper.');
          if (!ui.includes('COGNITIVE_ASSISTANCE_COMPLETED')) throw new Error('Direct cognitive completion handling missing.');
          if (!ui.includes('Generated responses are proposals only')) throw new Error('Cognitive authority boundary copy missing.');
          console.log('COMBINED_SECURITY_BOUNDARY_AUDIT=PASS');
          NODE

      - name: Require configured live cognitive provider credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}"
          echo "LIVE_COGNITIVE_PROVIDER_CREDENTIAL_PRESENT=PASS"

      - name: Generate masked disposable Owner credential
        run: |
          set -euo pipefail
          token="$(node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$token"
          echo "LATTICE_OWNER_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Migrate disposable PostgreSQL
        working-directory: product
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55436/lattice_auth_cog
        run: npm run db:migrate

      - name: Locate hosted browser
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          echo "AUTH_COG_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"

      - name: Durable authenticated cognitive-assistance journey
        working-directory: product
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55436/lattice_auth_cog
          LATTICE_DEPLOYMENT_MODE: durable
          LATTICE_AUTHENTICATION_MODE: required
          LATTICE_AUTO_MIGRATE: 'false'
          LATTICE_TRUTH_MODE: v36-offline
          LATTICE_SOLANDRA_COGNITION_ROUTE: groq-gpt-oss-120b
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PORT: '3116'
          HOST: 127.0.0.1
          AUTH_COG_BASE_URL: http://127.0.0.1:3116
        run: |
          set -euo pipefail
          test -n "${LATTICE_OWNER_ACCESS_TOKEN:-}"
          test -n "${GROQ_API_KEY:-}"
          node dist/src/index.js >/tmp/lattice-auth-cog.log 2>&1 &
          app_pid=$!
          cleanup() { kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3116/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then cat /tmp/lattice-auth-cog.log; exit 1; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:3116/health >/dev/null

          noauth_status="$(curl -sS -o /tmp/auth-cog-noauth.json -w '%{http_code}' http://127.0.0.1:3116/api/v1/capabilities/user-model)"
          test "$noauth_status" = "401"
          node -e "const b=require('/tmp/auth-cog-noauth.json'); if(b.error!=='AUTHENTICATION_REQUIRED') process.exit(1)"
          echo "AUTH_COG_UNAUTHENTICATED_401=PASS"

          authenticated_status="$(curl -sS -o /tmp/auth-cog-status.json -w '%{http_code}' -H "Authorization: Bearer $LATTICE_OWNER_ACCESS_TOKEN" http://127.0.0.1:3116/api/v1/capabilities/user-model)"
          test "$authenticated_status" = "200"
          node -e "const b=require('/tmp/auth-cog-status.json'); if(b.capability?.status!=='DISCONNECTED'||b.capability?.available!==true) process.exit(1)"
          echo "AUTH_COG_OWNER_SUBJECT_AND_CAPABILITY=PASS"

          if grep -F "$LATTICE_OWNER_ACCESS_TOKEN" /tmp/lattice-auth-cog.log >/dev/null; then
            echo 'Owner credential appeared in application logs' >&2
            exit 1
          fi
          if grep -F "$GROQ_API_KEY" /tmp/lattice-auth-cog.log >/dev/null; then
            echo 'Provider credential appeared in application logs' >&2
            exit 1
          fi

          node ../validation/authenticated-cognitive-browser-proof.mjs

          if grep -F "$LATTICE_OWNER_ACCESS_TOKEN" /tmp/lattice-auth-cog.log >/dev/null; then
            echo 'Owner credential appeared in application logs after journey' >&2
            exit 1
          fi
          if grep -F "$GROQ_API_KEY" /tmp/lattice-auth-cog.log >/dev/null; then
            echo 'Provider credential appeared in application logs after journey' >&2
            exit 1
          fi
          echo "AUTH_COG_CREDENTIALS_NOT_LOGGED=PASS"

      - name: Verify combined candidate unchanged after validation
        working-directory: product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fd153b6a32408d2819947f752f2bac34d6b3641e"
          test "$(git rev-parse HEAD^{tree})" = "7976f2926213aa0a6f70c6a491f726fbacdca452"
          echo "COMBINED_CANDIDATE_STILL_EXACT=PASS"
