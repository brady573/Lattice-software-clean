name: TEMP A5 Browser b961ef8

on:
  push:
    branches:
      - validation/a5-browser-proof-b961ef8
    paths:
      - ".github/workflows/a5-browser-proof-b961ef8-temporary.yml"

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b961ef8b7df1245a224ee173aecac2f60a9428b4
          path: subject
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0a1873a31dfae92de84a6fb6ec98cb89d8eda873
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify frozen Product and browser surface
        working-directory: subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b961ef8b7df1245a224ee173aecac2f60a9428b4"
          test "$(git rev-parse HEAD^{tree})" = "61d34a3ff612ceab26043f1f377826aeb066a635"
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          echo "A5_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
      - name: Install and build frozen subject
        working-directory: subject
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Syntax-check A5 browser harness
        working-directory: subject
        run: node --check ../harness/validation/a5-browser-proof.mjs
      - name: Execute A5 actual-browser proof
        working-directory: subject
        env:
          A5_BROWSER_ARTIFACT_DIR: artifacts/a5-browser
        run: node ../harness/validation/a5-browser-proof.mjs
      - name: Upload A5 browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a5-browser-b961ef8
          path: subject/artifacts/a5-browser/
          if-no-files-found: warn
          retention-days: 7
