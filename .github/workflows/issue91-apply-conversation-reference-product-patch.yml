name: Implementation — Issue 91 ConversationReference Patch

on:
  push:
    branches:
      - validation/issue-91-conversation-reference-audit-20260914
    paths:
      - tools/apply-issue91-conversation-reference-product-patch.py
      - .github/workflows/issue91-apply-conversation-reference-product-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply structural ConversationReference patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: validation/issue-91-conversation-reference-audit-20260914
          path: helper
          persist-credentials: false

      - name: Checkout Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-91/general-conversation-reference-continuity
          path: product
          fetch-depth: 0
          persist-credentials: true

      - name: Verify candidate lineage
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1431392e8d9871d8b7156b06495d461e6f7dfea4 HEAD
          test -z "$(git status --porcelain)"

      - name: Apply bounded structural patch
        working-directory: product
        run: python ../helper/tools/apply-issue91-conversation-reference-product-patch.py

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Build patched Product
        working-directory: product
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit Product patch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "brady573"
          git config user.email "114089255+brady573@users.noreply.github.com"
          git add src/runtime-app.ts src/consultation-intake.ts src/conversation/continuity-api.ts
          if git diff --cached --quiet; then
            echo "No Product patch changes to commit."
            exit 0
          fi
          git commit -m "Establish general ConversationReference continuity"
          git push origin HEAD:issue-91/general-conversation-reference-continuity
