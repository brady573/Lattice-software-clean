name: TEMP M4 Opaque Held-Out Evaluation

on:
  push:
    branches:
      - validation/m4-general-decision-journey
    paths:
      - ".github/workflows/m4-held-out-opaque-evaluation.yml"

permissions:
  contents: read

jobs:
  held-out:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUBJECT_SHA: 71545f69b60b4c7d85d539d5ab630ba776dc8599
      SUBJECT_TREE: bc91c39ec346b8f5fe79397705dc734f2241c6e2
    steps:
      - name: Checkout exact frozen Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 71545f69b60b4c7d85d539d5ab630ba776dc8599
          persist-credentials: false

      - name: Verify frozen SHA and tree before any held-out access
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          echo "FROZEN_SHA_TREE_VERIFIED=PASS"

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build exact frozen Product candidate
        run: npm run build

      - name: Synthetic harness validation without held-out secret
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          function parseEnvelope(raw, expectedCandidate) {
            const envelope = JSON.parse(raw);
            assert.equal(typeof envelope, 'object');
            assert.ok(envelope);
            assert.ok(Array.isArray(envelope.probes));
            assert.equal(envelope.probes.length, 8);
            if (envelope.candidate !== undefined && envelope.candidate !== null && envelope.candidate !== '') {
              assert.equal(envelope.candidate, expectedCandidate);
            }
            return envelope.probes.map((probe, index) => {
              assert.equal(typeof probe?.id, 'string');
              assert.ok(probe.id.trim().length > 0);
              assert.ok(Array.isArray(probe.turns) && probe.turns.length > 0);
              assert.ok(probe.turns.every((turn) => typeof turn === 'string' && turn.trim().length > 0));
              assert.ok(Array.isArray(probe.pass_conditions) && probe.pass_conditions.length > 0);
              assert.ok(probe.pass_conditions.every((condition) => typeof condition === 'string' && condition.trim().length > 0));
              return { id: probe.id, turns: probe.turns, passConditions: probe.pass_conditions, index };
            });
          }

          function conditionCode(condition) {
            const c = condition.toLowerCase();
            if (c.includes('recommendation') && (c.includes('establish') || c.includes('created') || c.includes('durable'))) return 'EXPECT_RECOMMENDATION';
            if (c.includes('clarif')) return 'EXPECT_CLARIFICATION';
            if (c.includes('acceptedchoice') || c.includes('accepted choice')) return c.includes('no ') || c.includes('not ') ? 'EXPECT_NO_ACCEPTED_CHOICE' : 'EXPECT_ACCEPTED_CHOICE';
            if (c.includes('authorizationgranted') || (c.includes('authorization') && c.includes('false'))) return 'EXPECT_NO_AUTHORIZATION';
            if (c.includes('executionauthorized') || (c.includes('execution') && c.includes('false'))) return 'EXPECT_NO_EXECUTION_AUTHORITY';
            if (c.includes('knowledge') && (c.includes('govern') || c.includes('establish'))) return 'EXPECT_KNOWLEDGE';
            if (c.includes('option') && (c.includes('stable') || c.includes('identity') || c.includes('id'))) return 'EXPECT_OPTION_IDENTITY';
            if (c.includes('user') && c.includes('provenance')) return 'EXPECT_USER_PROVENANCE';
            if (c.includes('formal decision engine') || c.includes('decision engine')) return 'EXPECT_NO_FORMAL_ENGINE';
            return 'OPAQUE_CONDITION';
          }

          const synthetic = {
            version: 'synthetic-v1',
            candidate: process.env.SUBJECT_SHA,
            probes: Array.from({ length: 8 }, (_, index) => ({
              id: `SYNTH_${index + 1}`,
              classes: ['synthetic'],
              description: `not logged description ${index + 1}`,
              turns: index === 7 ? ['synthetic turn alpha', 'synthetic turn beta'] : [`synthetic turn ${index + 1}`],
              pass_conditions: ['recommendation established'],
            })),
          };
          const probes = parseEnvelope(JSON.stringify(synthetic), process.env.SUBJECT_SHA);
          const dispatchLog = [];
          for (const probe of probes) {
            for (let turnIndex = 0; turnIndex < probe.turns.length; turnIndex += 1) {
              dispatchLog.push({ id: probe.id, turnIndex, opaqueValue: probe.turns[turnIndex] });
            }
            assert.deepEqual(probe.passConditions.map(conditionCode), ['EXPECT_RECOMMENDATION']);
            console.log(`SYNTHETIC_${probe.id}=PASS`);
          }
          assert.equal(probes.length, 8);
          assert.deepEqual(dispatchLog.filter((item) => item.id === 'SYNTH_8').map((item) => item.turnIndex), [0, 1]);
          const visible = probes.map((probe) => `SYNTHETIC_${probe.id}=PASS`).join('\n');
          assert.equal(visible.includes('synthetic turn'), false);
          assert.equal(visible.includes('recommendation established'), false);
          assert.equal(visible.includes('not logged description'), false);
          console.log('SYNTHETIC_HARNESS_CASE_COUNT=8');
          console.log('SYNTHETIC_HARNESS_SINGLE_AND_MULTI_TURN=PASS');
          console.log('SYNTHETIC_HARNESS_OPAQUE_LOGGING=PASS');
          NODE

      - name: Execute complete real opaque held-out set exactly once
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LATTICE_M4_HELD_OUT_PROBES: ${{ secrets.LATTICE_M4_HELD_OUT_PROBES }}
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          import { createRuntimeApp } from './dist/src/runtime-app.js';
          import { resolveRuntimeConfig } from './dist/src/runtime-config.js';
          import {
            GROQ_KNOWLEDGE_SIMPLIFIER_MODEL,
            GroqKnowledgeSimplifierModelProvider,
            GroqKnowledgeSimplifierModelRuntime,
          } from './dist/src/model/groq-knowledge-simplifier.js';
          import { ModelSolandraCognitiveRuntime } from './dist/src/solandra/cognition.js';
          import { ModelSolandraAdvisoryRuntime } from './dist/src/solandra/advisory.js';
          import { ModelSolandraActionPreparer } from './dist/src/solandra/action-preparer.js';
          import { ModelSolandraKnowledgePresenter } from './dist/src/solandra/knowledge-presenter.js';

          function heldOutError(code) {
            const error = new Error(code);
            error.name = 'HeldOutEvaluationError';
            throw error;
          }

          function safeId(value, index) {
            const id = typeof value === 'string' ? value.trim() : '';
            if (!id) heldOutError(`PROBE_${index + 1}_INVALID_ID`);
            return id.replace(/[^A-Za-z0-9_.:-]/gu, '_').slice(0, 80) || `PROBE_${index + 1}`;
          }

          function parseEnvelope(raw) {
            if (!raw) heldOutError('HELD_OUT_SOURCE_MISSING');
            let envelope;
            try { envelope = JSON.parse(raw); } catch { heldOutError('HELD_OUT_SOURCE_INVALID_JSON'); }
            if (!envelope || typeof envelope !== 'object' || !Array.isArray(envelope.probes)) heldOutError('HELD_OUT_SOURCE_UNSUPPORTED_ENVELOPE');
            if (envelope.probes.length !== 8) heldOutError('HELD_OUT_SOURCE_CASE_COUNT_MISMATCH');
            if (envelope.candidate !== undefined && envelope.candidate !== null && envelope.candidate !== '' && envelope.candidate !== process.env.SUBJECT_SHA) {
              heldOutError('HELD_OUT_SOURCE_CANDIDATE_MISMATCH');
            }
            return envelope.probes.map((probe, index) => {
              const id = safeId(probe?.id, index);
              if (!Array.isArray(probe?.turns) || probe.turns.length === 0 || !probe.turns.every((turn) => typeof turn === 'string' && turn.trim().length > 0)) {
                heldOutError(`HELD_OUT_${id}_INVALID_TURNS`);
              }
              if (!Array.isArray(probe?.pass_conditions) || probe.pass_conditions.length === 0 || !probe.pass_conditions.every((condition) => typeof condition === 'string' && condition.trim().length > 0)) {
                heldOutError(`HELD_OUT_${id}_INVALID_PASS_CONDITIONS`);
              }
              return {
                id,
                classes: Array.isArray(probe.classes) ? probe.classes.filter((item) => typeof item === 'string').map((item) => item.slice(0, 80)) : [],
                turns: probe.turns,
                passConditions: probe.pass_conditions,
              };
            });
          }

          function conditionSpec(condition) {
            const c = condition.toLowerCase();
            const negative = /\b(no|not|never|without|must not|does not|do not)\b/u.test(c);
            if (c.includes('needs_clarification') || c.includes('needs clarification') || c.includes('clarif')) return { code: 'EXPECT_CLARIFICATION', kind: 'clarification', expected: !negative };
            if (c.includes('recommendation_established') || (c.includes('recommendation') && (c.includes('establish') || c.includes('durable') || c.includes('created') || c.includes('appropriate')))) return { code: negative ? 'EXPECT_NO_RECOMMENDATION' : 'EXPECT_RECOMMENDATION', kind: 'recommendation', expected: !negative };
            if (c.includes('acceptedchoice') || c.includes('accepted choice')) return { code: negative ? 'EXPECT_NO_ACCEPTED_CHOICE' : 'EXPECT_ACCEPTED_CHOICE', kind: 'acceptedChoice', expected: !negative };
            if (c.includes('authorizationgranted') || (c.includes('authorization') && (c.includes('false') || negative))) return { code: 'EXPECT_NO_AUTHORIZATION', kind: 'authorizationGranted', expected: false };
            if (c.includes('executionauthorized') || (c.includes('execution') && (c.includes('false') || negative))) return { code: 'EXPECT_NO_EXECUTION_AUTHORITY', kind: 'executionAuthorized', expected: false };
            if (c.includes('verification') && negative) return { code: 'EXPECT_NO_VERIFICATION', kind: 'verification', expected: false };
            if (c.includes('knowledge') && (c.includes('govern') || c.includes('establish') || c.includes('v36') || c.includes('external fact'))) return { code: negative ? 'EXPECT_NO_KNOWLEDGE' : 'EXPECT_KNOWLEDGE', kind: 'knowledge', expected: !negative };
            if (c.includes('option') && (c.includes('stable') || c.includes('identity') || c.includes('id'))) return { code: 'EXPECT_OPTION_IDENTITY', kind: 'optionIdentity', expected: true };
            if (c.includes('user') && c.includes('provenance')) return { code: 'EXPECT_USER_PROVENANCE', kind: 'userProvenance', expected: true };
            if (c.includes('discussion') && (c.includes('selection') || c.includes('choice'))) return { code: 'EXPECT_DISCUSSION_NOT_SELECTION', kind: 'acceptedChoice', expected: false };
            if ((c.includes('formal decision engine') || c.includes('decision engine')) && (negative || c.includes('not require') || c.includes('without'))) return { code: 'EXPECT_NO_FORMAL_ENGINE', kind: 'formalEngine', expected: false };
            if (c.includes('uncertaint')) return { code: 'EXPECT_UNCERTAINTY_PRESERVED', kind: 'uncertainty', expected: true };
            if (c.includes('continuity') || c.includes('persist')) return { code: 'EXPECT_CONTINUITY', kind: 'continuity', expected: true };
            if (c.includes('requestedhelp') && c.includes('decision')) return { code: 'EXPECT_DECISION_CLASSIFICATION', kind: 'decisionClassification', expected: true };
            return { code: 'UNSUPPORTED_OPAQUE_CONDITION', kind: 'unsupported', expected: true };
          }

          async function waitRunOutcome(app, runId) {
            for (let attempt = 0; attempt < 300; attempt += 1) {
              const response = await app.inject({ method: 'GET', url: `/api/v1/runs/${runId}` });
              if (response.statusCode !== 200) return { state: 'READ_FAILURE', outcome: null };
              const run = response.json();
              if (run.status === 'FAILED' || run.status === 'CANCELLED') return { state: run.status, outcome: null };
              if (run.status === 'COMPLETED') {
                const outcomeResponse = await app.inject({ method: 'GET', url: `/api/v1/runs/${runId}/outcome` });
                return { state: outcomeResponse.statusCode === 200 ? 'COMPLETED' : 'OUTCOME_READ_FAILURE', outcome: outcomeResponse.statusCode === 200 ? outcomeResponse.json() : null };
              }
              await new Promise((resolve) => setTimeout(resolve, 20));
            }
            return { state: 'TIMEOUT', outcome: null };
          }

          function summarizeTurn(response, body, runResult) {
            return {
              httpStatus: response.statusCode,
              status: body?.status ?? null,
              requestedHelp: body?.interpretation?.requestedHelp ?? null,
              authority: body?.interpretation?.authority ?? null,
              decisionNeed: body?.decisionNeed ?? null,
              recommendationEstablished: body?.status === 'RECOMMENDATION_ESTABLISHED' || Boolean(body?.recommendationReference),
              recommendationIdPresent: Boolean(body?.recommendationReference?.recommendationId),
              optionCount: Array.isArray(body?.recommendationReference?.options) ? body.recommendationReference.options.length : null,
              optionIdsPresent: Array.isArray(body?.recommendationReference?.options) ? body.recommendationReference.options.every((option) => typeof option?.optionId === 'string' && option.optionId.length > 0) : null,
              selectionAuthorized: body?.recommendationReference?.selectionAuthorized ?? null,
              runCreated: Boolean(body?.runId),
              runState: runResult?.state ?? null,
              outcomeKind: runResult?.outcome?.outcome?.kind ?? runResult?.outcome?.kind ?? null,
              advisoryStatus: runResult?.outcome?.advisory?.status ?? null,
            };
          }

          function summarizeContinuity(body) {
            const recommendations = Array.isArray(body?.recommendations) ? body.recommendations : [];
            const choices = Array.isArray(body?.acceptedChoices) ? body.acceptedChoices : [];
            const knowledge = Array.isArray(body?.knowledge) ? body.knowledge : [];
            return {
              runCount: Array.isArray(body?.runs) ? body.runs.length : null,
              knowledgeCount: knowledge.length,
              recommendationCount: recommendations.length,
              acceptedChoiceCount: choices.length,
              recommendationSelectionAuthorizedFalse: recommendations.every((item) => item?.selectionAuthorized === false),
              acceptedChoiceAuthorizationGrantedFalse: choices.every((item) => item?.authorizationGranted === false),
              acceptedChoiceExecutionAuthorizedFalse: choices.every((item) => item?.executionAuthorized === false),
              acceptedChoiceUserProvenance: choices.every((item) => typeof item?.sourceMessageId === 'string' && item.sourceMessageId.length > 0),
              recommendationOptionIdsPresent: recommendations.every((item) => Array.isArray(item?.options) && item.options.every((option) => typeof option?.optionId === 'string' && option.optionId.length > 0)),
            };
          }

          function actualForCondition(kind, turnSummaries, continuity) {
            const latest = turnSummaries.at(-1) ?? {};
            switch (kind) {
              case 'clarification': return latest.status === 'NEEDS_CLARIFICATION';
              case 'recommendation': return continuity.recommendationCount > 0 || turnSummaries.some((turn) => turn.recommendationEstablished);
              case 'acceptedChoice': return continuity.acceptedChoiceCount > 0;
              case 'authorizationGranted': return !continuity.acceptedChoiceAuthorizationGrantedFalse;
              case 'executionAuthorized': return !continuity.acceptedChoiceExecutionAuthorizedFalse;
              case 'verification': return false;
              case 'knowledge': return continuity.knowledgeCount > 0;
              case 'optionIdentity': return continuity.recommendationCount > 0 && continuity.recommendationOptionIdsPresent;
              case 'userProvenance': return continuity.acceptedChoiceCount > 0 && continuity.acceptedChoiceUserProvenance;
              case 'formalEngine': return turnSummaries.some((turn) => turn.runCreated && turn.outcomeKind === 'Decision Support');
              case 'uncertainty': return latest.status === 'NEEDS_CLARIFICATION' || latest.advisoryStatus === 'NEEDS_KNOWLEDGE' || latest.status === 'RECOMMENDATION_ESTABLISHED';
              case 'continuity': return true;
              case 'decisionClassification': return turnSummaries.some((turn) => turn.requestedHelp === 'DECISION');
              default: return null;
            }
          }

          const probes = parseEnvelope(process.env.LATTICE_M4_HELD_OUT_PROBES);
          console.log('HELD_OUT_ENVELOPE_VALIDATION=PASS');
          console.log('HELD_OUT_CASE_COUNT=8');

          const diagnostics = [];
          const config = resolveRuntimeConfig({
            ...process.env,
            LATTICE_DEPLOYMENT_MODE: 'development',
            LATTICE_TRUTH_MODE: 'v36-offline',
            LATTICE_AUTHENTICATION_MODE: 'development-fixture',
            LATTICE_DEVELOPMENT_FIXTURE_SUBJECT_ID: 'm4-held-out-user',
            LATTICE_SOLANDRA_COGNITION_ROUTE: 'groq-gpt-oss-120b',
          });
          if (config.solandraCognitionRoute !== 'groq-gpt-oss-120b') heldOutError('CONFIGURED_ROUTE_MISMATCH');
          const provider = new GroqKnowledgeSimplifierModelProvider({
            apiKey: config.solandraCognitionApiKey,
            diagnosticSink: (diagnostic) => diagnostics.push({
              finishReason: diagnostic.finishReason,
              promptTokens: diagnostic.promptTokens,
              completionTokens: diagnostic.completionTokens,
              totalTokens: diagnostic.totalTokens,
              upstreamRequestIdPresent: Boolean(diagnostic.upstreamRequestId),
            }),
          });
          const runtime = new GroqKnowledgeSimplifierModelRuntime(provider);
          const app = await createRuntimeApp(config, {
            memoryDispatchDelayMs: 1,
            solandraCognition: new ModelSolandraCognitiveRuntime(runtime, GROQ_KNOWLEDGE_SIMPLIFIER_MODEL),
            solandraAdvisory: new ModelSolandraAdvisoryRuntime(runtime, GROQ_KNOWLEDGE_SIMPLIFIER_MODEL),
            solandraActionPreparer: new ModelSolandraActionPreparer(runtime, GROQ_KNOWLEDGE_SIMPLIFIER_MODEL),
            solandraKnowledgePresenter: new ModelSolandraKnowledgePresenter(runtime, GROQ_KNOWLEDGE_SIMPLIFIER_MODEL),
          });

          const summaries = [];
          try {
            for (const probe of probes) {
              const created = await app.inject({ method: 'POST', url: '/api/v1/conversations' });
              if (created.statusCode !== 201) {
                summaries.push({ id: probe.id, pass: false, class: 2, blocking: true, failures: ['CONVERSATION_CREATE_FAILURE'], turns: [], continuity: null });
                continue;
              }
              const conversationId = created.json().conversation.id;
              const turnSummaries = [];
              const failures = [];
              for (let turnIndex = 0; turnIndex < probe.turns.length; turnIndex += 1) {
                const response = await app.inject({
                  method: 'POST',
                  url: `/api/v1/conversations/${conversationId}/turns`,
                  payload: { turnId: randomUUID(), message: probe.turns[turnIndex] },
                });
                let body = null;
                try { body = response.json(); } catch {}
                const runResult = body?.runId ? await waitRunOutcome(app, body.runId) : null;
                turnSummaries.push(summarizeTurn(response, body, runResult));
              }
              const continuityResponse = await app.inject({ method: 'GET', url: `/api/v1/conversations/${conversationId}/continuity` });
              if (continuityResponse.statusCode !== 200) {
                summaries.push({ id: probe.id, pass: false, class: 2, blocking: true, failures: ['CONTINUITY_READ_FAILURE'], turns: turnSummaries, continuity: null });
                continue;
              }
              const continuity = summarizeContinuity(continuityResponse.json());
              if (!continuity.recommendationSelectionAuthorizedFalse) failures.push('RECOMMENDATION_AUTHORITY_VIOLATION');
              if (!continuity.acceptedChoiceAuthorizationGrantedFalse) failures.push('ACCEPTED_CHOICE_AUTHORIZATION_VIOLATION');
              if (!continuity.acceptedChoiceExecutionAuthorizedFalse) failures.push('ACCEPTED_CHOICE_EXECUTION_VIOLATION');

              const expectedCodes = [];
              for (const condition of probe.passConditions) {
                const spec = conditionSpec(condition);
                expectedCodes.push(spec.code);
                if (spec.kind === 'unsupported') {
                  failures.push('UNSUPPORTED_OPAQUE_CONDITION');
                  continue;
                }
                const actual = actualForCondition(spec.kind, turnSummaries, continuity);
                if (actual !== spec.expected) failures.push(`${spec.code}_MISMATCH`);
              }

              let alphaClass = null;
              let blocking = false;
              if (failures.some((item) => item.includes('AUTHORITY_VIOLATION'))) { alphaClass = 4; blocking = true; }
              else if (failures.some((item) => item === 'CONVERSATION_CREATE_FAILURE' || item === 'CONTINUITY_READ_FAILURE')) { alphaClass = 2; blocking = true; }
              else if (failures.some((item) => item === 'UNSUPPORTED_OPAQUE_CONDITION')) { alphaClass = null; blocking = false; }
              else if (failures.length > 0) {
                const classHint = probe.classes.map((item) => item.toLowerCase());
                if (classHint.some((item) => item.includes('stage'))) alphaClass = 1;
                else if (classHint.some((item) => item.includes('connection'))) alphaClass = 2;
                else if (classHint.some((item) => item.includes('simulat') || item.includes('false'))) alphaClass = 3;
                else if (classHint.some((item) => item.includes('boundary') || item.includes('authority'))) alphaClass = 4;
                else alphaClass = 5;
                blocking = alphaClass >= 1 && alphaClass <= 4;
              }

              summaries.push({
                id: probe.id,
                pass: failures.length === 0,
                alphaClass,
                blocking,
                failures,
                expectedCodes,
                turns: turnSummaries,
                continuity,
              });
            }
          } finally {
            await app.close();
          }

          for (const summary of summaries) {
            console.log(`HELD_OUT_${summary.id}=${summary.pass ? 'PASS' : 'FAIL'}`);
            console.log('HELD_OUT_STRUCTURAL=' + JSON.stringify(summary));
          }
          console.log(`HELD_OUT_PRODUCT_CASES_EXECUTED=${summaries.length}`);
          console.log('HELD_OUT_MODEL_DIAGNOSTICS=' + JSON.stringify(diagnostics));
          if (summaries.some((item) => !item.pass)) process.exitCode = 2;
          NODE

      - name: Verify frozen Product candidate remained unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          echo "FROZEN_CANDIDATE_UNCHANGED=PASS"
