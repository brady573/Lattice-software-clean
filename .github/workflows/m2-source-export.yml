name: Temporary M2 exact patch publisher

on:
  push:
    branches:
      - qualification/m2-source-export
    paths:
      - .github/workflows/m2-source-export.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout qualification patch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qualification/m2-source-export
          path: qualification
          persist-credentials: false
      - name: Checkout exact M2 feature base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/m2-solandra-advisory-reasoning
          path: product
          persist-credentials: true
          fetch-depth: 1
      - name: Verify exact starting revision
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5ecbfed9a9a7693571ccbbdcfc03be02536f2532"
          test "$(git rev-parse 'HEAD^{tree}')" = "c30cce49a76c4fadbc1505b8a2c3374bfbe3e2ee"
      - name: Apply exact M2 patch blob
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc ../qualification/.m2/m2.patch.gz > "$RUNNER_TEMP/m2.patch"
          git apply --check "$RUNNER_TEMP/m2.patch"
          git apply "$RUNNER_TEMP/m2.patch"
          git diff --check
          git add -A
          test "$(git write-tree)" = "9311d395c59f5d8b1a53be1de84c52300dde9e31"
      - name: Commit and push exact candidate
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lattice Coding Agent"
          git config user.email "114089255+brady573@users.noreply.github.com"
          git commit -m "M2: Add Solandra advisory reasoning spine"
          test "$(git rev-parse HEAD^)" = "5ecbfed9a9a7693571ccbbdcfc03be02536f2532"
          test "$(git rev-parse 'HEAD^{tree}')" = "9311d395c59f5d8b1a53be1de84c52300dde9e31"
          git push origin HEAD:feature/m2-solandra-advisory-reasoning
