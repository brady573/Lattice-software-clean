name: Temporary M2 corrective focused validation

on:
  push:
    branches:
      - qualification/m2-source-export

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://lattice:lattice@127.0.0.1:55433/lattice_test
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice
          POSTGRES_DB: lattice_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact corrective candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 79be399bd989e31652d62854a551d0bde6470fbd
          persist-credentials: false
          fetch-depth: 1

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "79be399bd989e31652d62854a551d0bde6470fbd"
          test "$(git rev-parse 'HEAD^{tree}')" = "9c8c687c1f61b51e1cde713b4cd70d0c013db292"
          test "$(node -p "process.versions.node.split('.')[0]")" = "24"
          test "$(npm --version | cut -d. -f1)" = "11"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript build
        run: npm run build

      - name: Focused M2 structural acceptance
        run: node --import tsx --test test/m2-solandra-advisory-spine.test.ts

      - name: Reset PostgreSQL test schema
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query('DROP SCHEMA public CASCADE; CREATE SCHEMA public;');
          await client.end();
          NODE

      - name: M2 PostgreSQL Recommendation reconstruction acceptance
        run: node --import tsx --test --test-concurrency=1 test/m2-postgres-recommendation-restart.test.ts

      - name: Record exact validation
        run: |
          echo "M2_CORRECTIVE_FOCUSED=PASS sha=$(git rev-parse HEAD) tree=$(git rev-parse 'HEAD^{tree}')"
