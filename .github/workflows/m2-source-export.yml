name: Temporary M2 advisory contract repair publisher

on:
  push:
    branches:
      - qualification/m2-source-export

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout qualification repair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qualification/m2-source-export
          path: qualification
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact M2 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/m2-solandra-advisory-reasoning
          path: product
          persist-credentials: true
          fetch-depth: 1

      - name: Verify and apply advisory contract repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C qualification hash-object .m2/advisory-contract-fix.patch)" = "7f6037b0ecb56e54f698610d8674808e976f07f3"
          cd product
          test "$(git rev-parse HEAD)" = "716728c2312265ea9e67038b485e435d0d4915d9"
          test "$(git rev-parse 'HEAD^{tree}')" = "93443ec2a90f11158debc056d8881be9e2e52950"
          git apply --check ../qualification/.m2/advisory-contract-fix.patch
          git apply ../qualification/.m2/advisory-contract-fix.patch
          git diff --check
          git add -A
          test "$(git write-tree)" = "629ec724e481a198fd36e86a65ebf88746e08d43"

      - name: Commit and push advisory contract repair
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git write-tree)" = "629ec724e481a198fd36e86a65ebf88746e08d43"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M2: make advisory result contract unambiguously top-level"
          test "$(git rev-parse HEAD^)" = "716728c2312265ea9e67038b485e435d0d4915d9"
          test "$(git rev-parse 'HEAD^{tree}')" = "629ec724e481a198fd36e86a65ebf88746e08d43"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push origin HEAD:refs/heads/feature/m2-solandra-advisory-reasoning
