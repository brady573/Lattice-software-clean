name: Temporary M2 exact chunk publisher

on:
  push:
    branches:
      - qualification/m2-source-export

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout qualification transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qualification/m2-source-export
          path: qualification
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact M2 feature base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/m2-solandra-advisory-reasoning
          path: product
          persist-credentials: true
          fetch-depth: 1

      - name: Verify chunks and reconstruct patch
        shell: bash
        run: |
          set -euo pipefail
          expected_shas=(
            63ee386c2140ca3921f81fd4a1cb666533a3ffcb
            9296cd5c55d81a6e15caf1cbf1037808274c8237
            2dda89b6d9ffc386fa3caebd7562f8b33788d38d
            97e193a1550637eb43ffa37a1e4280f32eece29f
            b7b048a25ce06f28b3f18e0e1c406b72d0782d07
            309fb554802695fa1d0687270c69dd0ecbbf5207
            fcf48743b7f6ab94a6b1f90304cfd4ec7bfa645c
          )
          expected_sizes=(4000 4000 4000 4000 4000 4000 3020)
          for i in 0 1 2 3 4 5 6; do
            file="$(printf 'qualification/.m2/chunk%02d' "$i")"
            test "$(stat -c%s "$file")" = "${expected_sizes[$i]}"
            test "$(git hash-object "$file")" = "${expected_shas[$i]}"
          done

          cat qualification/.m2/chunk00 qualification/.m2/chunk01 qualification/.m2/chunk02 qualification/.m2/chunk03 qualification/.m2/chunk04 qualification/.m2/chunk05 qualification/.m2/chunk06 > "$RUNNER_TEMP/m2.patch.gz.b64"
          test "$(wc -c < "$RUNNER_TEMP/m2.patch.gz.b64")" -eq 27020
          base64 -d "$RUNNER_TEMP/m2.patch.gz.b64" > "$RUNNER_TEMP/m2.patch.gz"
          test "$(stat -c%s "$RUNNER_TEMP/m2.patch.gz")" -eq 20265
          echo "ee2c79a2cd6e7646afe099a95c6f024924cc384862ec196d78f11e4f061e5886  $RUNNER_TEMP/m2.patch.gz" | sha256sum -c -
          gzip -t "$RUNNER_TEMP/m2.patch.gz"
          gzip -dc "$RUNNER_TEMP/m2.patch.gz" > "$RUNNER_TEMP/m2.patch"
          test "$(stat -c%s "$RUNNER_TEMP/m2.patch")" -eq 92555

      - name: Verify exact base and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "5ecbfed9a9a7693571ccbbdcfc03be02536f2532"
          test "$(git rev-parse 'HEAD^{tree}')" = "c30cce49a76c4fadbc1505b8a2c3374bfbe3e2ee"
          git apply --check "$RUNNER_TEMP/m2.patch"
          git apply "$RUNNER_TEMP/m2.patch"
          git diff --check
          git add -A
          actual_tree="$(git write-tree)"
          echo "ACTUAL_TREE=$actual_tree"
          test "$actual_tree" = "9311d395c59f5d8b1a53be1de84c52300dde9e31"

      - name: Commit and push exact M2 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git write-tree)" = "9311d395c59f5d8b1a53be1de84c52300dde9e31"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M2: Add Solandra advisory reasoning"
          test "$(git rev-parse HEAD^)" = "5ecbfed9a9a7693571ccbbdcfc03be02536f2532"
          test "$(git rev-parse 'HEAD^{tree}')" = "9311d395c59f5d8b1a53be1de84c52300dde9e31"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push origin HEAD:refs/heads/feature/m2-solandra-advisory-reasoning
