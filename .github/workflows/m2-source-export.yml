name: Temporary M2 PostgreSQL-test correction publisher

on:
  push:
    branches:
      - qualification/m2-source-export

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout qualification correction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qualification/m2-source-export
          path: qualification
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact M2 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/m2-solandra-advisory-reasoning
          path: product
          persist-credentials: true
          fetch-depth: 1

      - name: Verify and apply PostgreSQL-test correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s qualification/.m2/pg-test-fix.patch)" -eq 1776
          test "$(git hash-object qualification/.m2/pg-test-fix.patch)" = "4a81c423411b21681cdbdc69780b677fa9fd7d74"
          cd product
          test "$(git rev-parse HEAD)" = "3f498ade44f3d82531a67dd7866ad79249151a0a"
          test "$(git rev-parse 'HEAD^{tree}')" = "bd57948fbc636d8878dc03f13aa7aba66f1f4666"
          git apply --check ../qualification/.m2/pg-test-fix.patch
          git apply ../qualification/.m2/pg-test-fix.patch
          git diff --check
          git add -A
          actual_tree="$(git write-tree)"
          echo "ACTUAL_TREE=$actual_tree"
          test "$actual_tree" = "9c8c687c1f61b51e1cde713b4cd70d0c013db292"

      - name: Commit and push PostgreSQL-test correction
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git write-tree)" = "9c8c687c1f61b51e1cde713b4cd70d0c013db292"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M2: assert governed source identities after PostgreSQL restart"
          test "$(git rev-parse HEAD^)" = "3f498ade44f3d82531a67dd7866ad79249151a0a"
          test "$(git rev-parse 'HEAD^{tree}')" = "9c8c687c1f61b51e1cde713b4cd70d0c013db292"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push origin HEAD:refs/heads/feature/m2-solandra-advisory-reasoning
