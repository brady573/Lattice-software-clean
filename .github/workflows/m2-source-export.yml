name: Temporary M2 patch publisher

on:
  push:
    branches:
      - qualification/m2-source-export

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact M2 feature base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/m2-solandra-advisory-reasoning
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact starting revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5ecbfed9a9a7693571ccbbdcfc03be02536f2532"
          test "$(git rev-parse 'HEAD^{tree}')" = "c30cce49a76c4fadbc1505b8a2c3374bfbe3e2ee"
      - name: Apply exact M2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/m2.patch.gz.b64" <<'PATCH'
          [...snipped by tool length...]
          PATCH
          base64 -d "$RUNNER_TEMP/m2.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/m2.patch"
          git apply --check "$RUNNER_TEMP/m2.patch"
          git apply "$RUNNER_TEMP/m2.patch"
          git diff --check
      - name: Commit and push M2 implementation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "brady573"
          git config user.email "114089255+brady573@users.noreply.github.com"
          git add migrations/034_recommendations.sql src test/m2-solandra-advisory-reasoning.test.ts
          git commit -m "Add Solandra advisory reasoning and durable recommendations"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feature/m2-solandra-advisory-reasoning
