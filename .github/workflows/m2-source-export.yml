name: Temporary M2 focused-test correction publisher

on:
  push:
    branches:
      - qualification/m2-source-export

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout qualification correction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qualification/m2-source-export
          path: qualification
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact M2 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/m2-solandra-advisory-reasoning
          path: product
          persist-credentials: true
          fetch-depth: 1

      - name: Verify and apply focused-test correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s qualification/.m2/test-fix.patch)" -eq 1818
          test "$(git hash-object qualification/.m2/test-fix.patch)" = "fe6dbc5e7287b5b44c626ae8550e9a4b11c198e9"
          cd product
          test "$(git rev-parse HEAD)" = "a274f9f326772fa72b3afe1df2e30168c5d9f90e"
          test "$(git rev-parse 'HEAD^{tree}')" = "3841fd870618751c52384825f8220e60a70d210b"
          git apply --check ../qualification/.m2/test-fix.patch
          git apply ../qualification/.m2/test-fix.patch
          git diff --check
          git add -A
          actual_tree="$(git write-tree)"
          echo "ACTUAL_TREE=$actual_tree"
          test "$actual_tree" = "bd57948fbc636d8878dc03f13aa7aba66f1f4666"

      - name: Commit and push focused-test correction
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git write-tree)" = "bd57948fbc636d8878dc03f13aa7aba66f1f4666"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M2: assert governed source identities in provenance test"
          test "$(git rev-parse HEAD^)" = "a274f9f326772fa72b3afe1df2e30168c5d9f90e"
          test "$(git rev-parse 'HEAD^{tree}')" = "bd57948fbc636d8878dc03f13aa7aba66f1f4666"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push origin HEAD:refs/heads/feature/m2-solandra-advisory-reasoning
