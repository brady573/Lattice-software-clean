name: Temporary M2 PostgreSQL fixture-order correction publisher

on:
  push:
    branches:
      - qualification/m2-source-export

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout qualification correction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qualification/m2-source-export
          path: qualification
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact M2 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/m2-solandra-advisory-reasoning
          path: product
          persist-credentials: true
          fetch-depth: 1

      - name: Verify and apply fixture-order correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object qualification/.m2/postgres-fixture-order.patch)" = "312334353697d0276a265318664abfb481792058"
          cd product
          test "$(git rev-parse HEAD)" = "79be399bd989e31652d62854a551d0bde6470fbd"
          test "$(git rev-parse 'HEAD^{tree}')" = "9c8c687c1f61b51e1cde713b4cd70d0c013db292"
          git apply --check ../qualification/.m2/postgres-fixture-order.patch
          git apply ../qualification/.m2/postgres-fixture-order.patch
          git diff --check
          git add -A
          test "$(git write-tree)" = "93443ec2a90f11158debc056d8881be9e2e52950"

      - name: Commit and push fixture-order correction
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git write-tree)" = "93443ec2a90f11158debc056d8881be9e2e52950"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M2: make PostgreSQL provenance fixture selection deterministic"
          test "$(git rev-parse HEAD^)" = "79be399bd989e31652d62854a551d0bde6470fbd"
          test "$(git rev-parse 'HEAD^{tree}')" = "93443ec2a90f11158debc056d8881be9e2e52950"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push origin HEAD:refs/heads/feature/m2-solandra-advisory-reasoning
