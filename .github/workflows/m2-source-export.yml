name: Temporary M2 compile repair publisher

on:
  push:
    branches:
      - qualification/m2-source-export

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout qualification repair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qualification/m2-source-export
          path: qualification
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact corrective candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/m2-solandra-advisory-reasoning
          path: product
          persist-credentials: true
          fetch-depth: 1

      - name: Verify and apply compile repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s qualification/.m2/compile-fix.patch)" -eq 672
          test "$(git hash-object qualification/.m2/compile-fix.patch)" = "b25d8fed1e09f4d9fa8e09dddd1809d6bae51920"
          cd product
          test "$(git rev-parse HEAD)" = "71ad489d90b729bc5e1dc0ae852446936a59a1cb"
          test "$(git rev-parse 'HEAD^{tree}')" = "d1667b180c26d46b560655d1ea2624fb4bdbe96d"
          git apply --check ../qualification/.m2/compile-fix.patch
          git apply ../qualification/.m2/compile-fix.patch
          git diff --check
          git add -A
          actual_tree="$(git write-tree)"
          echo "ACTUAL_TREE=$actual_tree"
          test "$actual_tree" = "3841fd870618751c52384825f8220e60a70d210b"

      - name: Commit and push compile repair
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git write-tree)" = "3841fd870618751c52384825f8220e60a70d210b"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M2: preserve deterministic continuation UUID type"
          test "$(git rev-parse HEAD^)" = "71ad489d90b729bc5e1dc0ae852446936a59a1cb"
          test "$(git rev-parse 'HEAD^{tree}')" = "3841fd870618751c52384825f8220e60a70d210b"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push origin HEAD:refs/heads/feature/m2-solandra-advisory-reasoning
