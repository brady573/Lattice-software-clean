name: Temporary frozen M2 Render Blueprint validation

on:
  push:
    branches:
      - qualification/m2-source-export

permissions:
  contents: read

jobs:
  validate-render-blueprint:
    name: Render blueprint validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 716728c2312265ea9e67038b485e435d0d4915d9
          persist-credentials: false

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate zero-cost Render blueprint contract
        env:
          SUBJECT_SOURCE_SHA: 716728c2312265ea9e67038b485e435d0d4915d9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "93443ec2a90f11158debc056d8881be9e2e52950"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const expected = `databases:
            - name: lattice-v36-postgres
              plan: free

          services:
            - type: web
              name: lattice-v36
              runtime: node
              plan: free
              buildCommand: npm ci --no-audit --no-fund && npm run build
              startCommand: npm start
              healthCheckPath: /health
              envVars:
                - key: HOST
                  value: 0.0.0.0
                - key: LATTICE_DEPLOYMENT_MODE
                  value: durable
                - key: LATTICE_TRUTH_MODE
                  value: v36-offline
                - key: LATTICE_AUTO_MIGRATE
                  value: "false"
                - key: DATABASE_URL
                  fromDatabase:
                    name: lattice-v36-postgres
                    property: connectionString`;

          const normalize = (value) => value.replace(/\r\n/gu, '\n').trimEnd();
          const actual = normalize(readFileSync('render.yaml', 'utf8'));
          if (actual !== normalize(expected)) {
            throw new Error('RENDER_BLUEPRINT_CONTRACT_FAILURE: render.yaml differs from the approved zero-cost blueprint');
          }
          if (/plan:\s*(starter|standard|pro|enterprise|basic)/u.test(actual)) {
            throw new Error('RENDER_BLUEPRINT_CONTRACT_FAILURE: paid plan token present');
          }
          if (/preDeployCommand|LATTICE_AUTO_MIGRATE:\s*true/u.test(actual)) {
            throw new Error('RENDER_BLUEPRINT_CONTRACT_FAILURE: unapproved migration automation present');
          }
          console.log('RENDER_BLUEPRINT_CONTRACT_VALIDATION=PASS');
          console.log('RENDER_ACCOUNT_VALIDATION=NOT_CLAIMED_BY_THIS_LANE');
          console.log('DEPLOYMENT_RUNTIME=NOT_CLAIMED_BY_THIS_LANE');
          NODE
