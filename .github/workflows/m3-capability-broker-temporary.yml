name: TEMP M3 Capability Broker Final Frozen Gate

on:
  push:
    branches:
      - validation/m3-capability-broker-9818c7b
    paths:
      - ".github/workflows/m3-capability-broker-temporary.yml"

permissions:
  contents: read

jobs:
  final-frozen-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUBJECT_SHA: 2f3b5a9a74f9d59f66fa6e376e394f31e6e3ec6b
      SUBJECT_TREE: d5816c43cb8f24ec52ab13eae03f0e9983d3bb8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2f3b5a9a74f9d59f66fa6e376e394f31e6e3ec6b
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify frozen subject and live credential surface
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          test -n "${GROQ_API_KEY:-}"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Ordinary Core Validation
        run: env -u DATABASE_URL npm run check
      - name: Live configured user-model Product proof
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LATTICE_M3_EXPECTED_SHA: 2f3b5a9a74f9d59f66fa6e376e394f31e6e3ec6b
          LATTICE_M3_EXPECTED_TREE: d5816c43cb8f24ec52ab13eae03f0e9983d3bb8a
          LATTICE_M3_ARTIFACT_DIR: artifacts/m3
        run: env -u DATABASE_URL node tools/m3-live-user-model-proof.mjs
      - name: Verify subject unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
      - name: Upload M3 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m3-capability-broker-2f3b5a9
          path: artifacts/m3/
          if-no-files-found: warn
          retention-days: 7
