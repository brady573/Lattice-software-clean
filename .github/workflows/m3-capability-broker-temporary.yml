name: TEMP M3 R1-R4 Frozen Evidence

on:
  push:
    branches:
      - validation/m3-capability-broker-9818c7b
    paths:
      - ".github/workflows/m3-capability-broker-temporary.yml"

permissions:
  contents: read

jobs:
  frozen-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://lattice:lattice@127.0.0.1:55433/lattice_test
      SUBJECT_SHA: 09b04fad9c931ae409577a9b09ca8e7849d74861
      SUBJECT_TREE: 1db6a07e8f2e4743c36f408f980c2d99f4da3112
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice
          POSTGRES_DB: lattice_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 09b04fad9c931ae409577a9b09ca8e7849d74861
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify frozen repair subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          test -n "${GROQ_API_KEY:-}"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: npm ci --no-audit --no-fund
      - name: Build invalidated M3 surface
        run: npm run build
      - name: Focused M3 R1-R4
        run: node --import tsx --test test/m3-capability-broker-user-model.test.ts
      - name: Reset PostgreSQL test schema
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query('DROP SCHEMA public CASCADE; CREATE SCHEMA public;');
          await client.end();
          NODE
      - name: M3 PostgreSQL grant/finalization acceptance
        run: node --import tsx --test --test-concurrency=1 test/m3-capability-authorization-postgres.test.ts test/runtime-schema-readiness-postgres.test.ts
      - name: Live configured user-model proof after finalization repair
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LATTICE_M3_EXPECTED_SHA: 09b04fad9c931ae409577a9b09ca8e7849d74861
          LATTICE_M3_EXPECTED_TREE: 1db6a07e8f2e4743c36f408f980c2d99f4da3112
          LATTICE_M3_ARTIFACT_DIR: artifacts/m3-r1-r4
        run: env -u DATABASE_URL node tools/m3-live-user-model-proof.mjs
      - name: Verify frozen repair subject unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
      - name: Upload M3 repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m3-r1-r4-09b04fad
          path: artifacts/m3-r1-r4/
          if-no-files-found: warn
          retention-days: 7
