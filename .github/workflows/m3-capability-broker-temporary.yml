name: TEMP M3 R1-R4 Staging Preflight

on:
  push:
    branches:
      - validation/m3-capability-broker-9818c7b
    paths:
      - ".github/workflows/m3-capability-broker-temporary.yml"

permissions:
  contents: read

jobs:
  staging-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://lattice:lattice@127.0.0.1:55433/lattice_test
      SUBJECT_SHA: 35c489cb57c4d3c5a4b7ba1228c891992ab08c83
      SUBJECT_TREE: 1db6a07e8f2e4743c36f408f980c2d99f4da3112
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice
          POSTGRES_DB: lattice_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 35c489cb57c4d3c5a4b7ba1228c891992ab08c83
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify staging subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Focused M3 R1-R4
        run: node --import tsx --test test/m3-capability-broker-user-model.test.ts
      - name: Reset PostgreSQL test schema
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query('DROP SCHEMA public CASCADE; CREATE SCHEMA public;');
          await client.end();
          NODE
      - name: M3 PostgreSQL grant/finalization acceptance
        run: node --import tsx --test --test-concurrency=1 test/m3-capability-authorization-postgres.test.ts test/runtime-schema-readiness-postgres.test.ts
