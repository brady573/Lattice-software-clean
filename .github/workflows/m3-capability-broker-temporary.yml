name: TEMP M3 Capability Broker Frozen Gate

on:
  push:
    branches:
      - validation/m3-capability-broker-9818c7b
    paths:
      - ".github/workflows/m3-capability-broker-temporary.yml"

permissions:
  contents: read

jobs:
  frozen-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://lattice:lattice@127.0.0.1:55433/lattice_test
      SUBJECT_SHA: 2f3b5a9a74f9d59f66fa6e376e394f31e6e3ec6b
      SUBJECT_TREE: d5816c43cb8f24ec52ab13eae03f0e9983d3bb8a
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice
          POSTGRES_DB: lattice_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2f3b5a9a74f9d59f66fa6e376e394f31e6e3ec6b
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify frozen subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          test -n "${GROQ_API_KEY:-}"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Focused M3 contract acceptance
        run: node --import tsx --test test/m3-capability-broker-user-model.test.ts
      - name: Reset PostgreSQL test schema
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query('DROP SCHEMA public CASCADE; CREATE SCHEMA public;');
          await client.end();
          NODE
      - name: M3 PostgreSQL grant restart acceptance
        run: node --import tsx --test --test-concurrency=1 test/m3-capability-authorization-postgres.test.ts test/runtime-schema-readiness-postgres.test.ts
      - name: Ordinary Core Validation
        env:
          DATABASE_URL: ""
        run: npm run check
      - name: Live configured user-model Product proof
        env:
          DATABASE_URL: ""
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LATTICE_M3_EXPECTED_SHA: 2f3b5a9a74f9d59f66fa6e376e394f31e6e3ec6b
          LATTICE_M3_EXPECTED_TREE: d5816c43cb8f24ec52ab13eae03f0e9983d3bb8a
          LATTICE_M3_ARTIFACT_DIR: artifacts/m3
        run: node tools/m3-live-user-model-proof.mjs
      - name: Verify subject unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
      - name: Upload M3 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m3-capability-broker-2f3b5a9
          path: artifacts/m3/
          if-no-files-found: warn
          retention-days: 7
