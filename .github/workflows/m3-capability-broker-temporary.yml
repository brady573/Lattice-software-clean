name: TEMP M3 Capability Broker Focused

on:
  push:
    branches:
      - validation/m3-capability-broker-9818c7b
    paths:
      - ".github/workflows/m3-capability-broker-temporary.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e7136b1ee59192e735412058d4ae152ceb9d6e83
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify subject
        run: |
          test "$(git rev-parse HEAD)" = "e7136b1ee59192e735412058d4ae152ceb9d6e83"
          test "$(git rev-parse HEAD^{tree})" = "9bf9b4f9b9d909c9e87fe151c35981d4223d671c"
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Focused M3
        run: node --import tsx --test test/m3-capability-broker-user-model.test.ts
