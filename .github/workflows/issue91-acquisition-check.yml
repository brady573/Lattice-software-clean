name: Validation — Issue 91 Acquisition Check

on:
  push:
    branches:
      - validation/issue91-acquisition-check-4def9613

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  acquisition-check:
    name: Exact candidate npm run check
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4def96130ddcf3f66810227e52e911f936cb760e
          persist-credentials: false

      - name: Verify exact candidate
        run: |
          @echo off
          for /f %%I in ('git rev-parse HEAD') do set "ACTUAL_SHA=%%I"
          if /I not "%ACTUAL_SHA%"=="4def96130ddcf3f66810227e52e911f936cb760e" exit /b 1
          for /f %%I in ('git rev-parse HEAD^{tree}') do set "ACTUAL_TREE=%%I"
          if /I not "%ACTUAL_TREE%"=="3759afbd7fbffd3df2a9e714c6ec1fb3fec7ff1b" exit /b 1

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository check
        run: npm run check

      - name: Confirm Product candidate unchanged
        run: |
          @echo off
          if not ""=="%errorlevel%" exit /b %errorlevel%
          for /f %%I in ('git rev-parse HEAD') do set "FINAL_SHA=%%I"
          if /I not "%FINAL_SHA%"=="4def96130ddcf3f66810227e52e911f936cb760e" exit /b 1
          echo ISSUE91_ACQUISITION_CHECK=PASS sha=%FINAL_SHA%
