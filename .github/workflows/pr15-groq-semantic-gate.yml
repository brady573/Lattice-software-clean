name: Temporary PR #15 Groq semantic gate

on:
  push:
    branches:
      - qualification/pr15-groq-semantic-gate

permissions:
  contents: read

jobs:
  semantic-qualification:
    name: Frozen PR #15 Groq semantic qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3d4807dd6829b365f90de8407730f8ce4279a589
          persist-credentials: false

      - name: Verify frozen subject identity
        shell: bash
        env:
          CANDIDATE_SHA: 3d4807dd6829b365f90de8407730f8ce4279a589
          CANDIDATE_TREE: d120eb5a060580e8ee92d98f4d4a72f3457bd1d0
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$CANDIDATE_SHA" ]]; then
            echo "CANDIDATE_SHA_MISMATCH" >&2
            exit 1
          fi
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$actual_tree" != "$CANDIDATE_TREE" ]]; then
            echo "CANDIDATE_TREE_MISMATCH" >&2
            exit 1
          fi
          printf 'CANDIDATE_SHA=%s\n' "$actual_sha"
          printf 'CANDIDATE_TREE=%s\n' "$actual_tree"

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Generate temporary semantic runner
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pr15-groq-semantic-gate.mts" <<'EOF'
          import { strict as assert } from "node:assert";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          const CANDIDATE_SHA = "3d4807dd6829b365f90de8407730f8ce4279a589";
          const CANDIDATE_TREE = "d120eb5a060580e8ee92d98f4d4a72f3457bd1d0";
          const REQUESTED_MODEL = "openai/gpt-oss-120b";
          const REQUESTED_PROVIDER = "groq";
          const FOLLOW_UP = "Put that in plain language.";
          const SYNTHETIC_OBJECTIVE = "Synthetic semantic qualification fixture; its factual content is not asserted as real-world truth.";

          const workspace = process.env.GITHUB_WORKSPACE;
          if (!workspace) throw new Error("GITHUB_WORKSPACE is unavailable.");
          const apiKey = process.env.GROQ_API_KEY;
          if (!apiKey) throw new Error("CREDENTIAL_SURFACE_BLOCKED");

          const moduleUrl = (relativePath: string): string =>
            pathToFileURL(join(workspace, relativePath)).href;

          const groqModule = await import(moduleUrl("src/model/groq-knowledge-simplifier.ts"));
          const simplificationModule = await import(moduleUrl("src/presentation/solandra/knowledge-simplification.ts"));
          const responseModule = await import(moduleUrl("src/presentation/solandra/knowledge-response.ts"));

          const {
            GROQ_KNOWLEDGE_SIMPLIFIER_MODEL,
            GroqKnowledgeSimplifierModelProvider,
            GroqKnowledgeSimplifierModelRuntime,
          } = groqModule;
          const { ModelKnowledgeSimplifier } = simplificationModule;
          const { renderKnowledgeResponseForRun } = responseModule;

          assert.equal(GROQ_KNOWLEDGE_SIMPLIFIER_MODEL, REQUESTED_MODEL);

          class ObservedProvider extends GroqKnowledgeSimplifierModelProvider {
            invocationCount = 0;

            override async generate(request: unknown, context: unknown): Promise<unknown> {
              this.invocationCount += 1;
              return await super.generate(request, context);
            }
          }

          class ObservedRuntime extends GroqKnowledgeSimplifierModelRuntime {
            readonly observedResults: unknown[] = [];

            override async call(rawRequest: unknown, options: unknown): Promise<unknown> {
              const result = await super.call(rawRequest, options);
              this.observedResults.push(result);
              return result;
            }
          }

          class ObservedSimplifier {
            readonly guardedResults: Array<string | null> = [];

            constructor(private readonly inner: InstanceType<typeof ModelKnowledgeSimplifier>) {}

            async simplify(input: unknown): Promise<string | null> {
              const result = await this.inner.simplify(input);
              this.guardedResults.push(result);
              return result;
            }
          }

          const cases = Object.freeze([
            Object.freeze({
              id: "A",
              text: "The semiconductor's depletion region widens under reverse bias because the applied potential increases the built-in electric field and drives majority carriers away from the junction.",
            }),
            Object.freeze({
              id: "B",
              text: "The available measurements do not establish that additive Q causes the observed failure; they suggest only a possible association.",
            }),
            Object.freeze({
              id: "C",
              text: "The reported efficiency gain applies only when the device operates below 40 °C under continuous load; performance under intermittent load was not evaluated.",
            }),
          ]);

          const provider = new ObservedProvider({ apiKey });
          const runtime = new ObservedRuntime(provider);
          const modelSimplifier = new ModelKnowledgeSimplifier(runtime, REQUESTED_MODEL);
          const simplifier = new ObservedSimplifier(modelSimplifier);
          const evidenceCases: unknown[] = [];
          let infrastructureValid = true;

          for (const fixture of cases) {
            const finding = {
              claimId: `synthetic-qualification-${fixture.id}`,
              text: fixture.text,
              status: "UNRESOLVED",
              confidence: "LOW",
              evidenceIds: [`synthetic-evidence-${fixture.id}`],
              contradictoryEvidenceIds: [],
              temporalQualifiers: { effectiveAt: null, period: null },
              basis: "SOURCE_REPORT",
            };
            const knowledge = {
              kind: "KNOWLEDGE",
              objective: SYNTHETIC_OBJECTIVE,
              acceptedUnderstanding: SYNTHETIC_OBJECTIVE,
              findings: [finding],
              uncertainties: [
                "Synthetic qualification fixture only; no factual content in this fixture is asserted as real-world truth.",
              ],
              provenance: [],
              truthAssessmentIds: [],
            };
            const run = {
              id: `synthetic-qualification-run-${fixture.id}`,
              conversationId: "synthetic-qualification-conversation",
              status: "COMPLETED",
              version: 1,
              request: {
                kind: "consultation",
                objective: SYNTHETIC_OBJECTIVE,
                context: [FOLLOW_UP],
                decisionNeed: "NONE",
                resourceNeed: "NONE",
                sourceMessageId: `synthetic-qualification-message-${fixture.id}`,
                sourceMessageDigest: "0".repeat(64),
                intentVersion: 1,
              },
              decision: null,
              explanation: null,
              truthAssessmentIds: [],
              events: [],
            };

            const canonicalBefore = JSON.stringify(knowledge);
            const providerBefore = provider.invocationCount;
            const runtimeBefore = runtime.observedResults.length;
            const guardBefore = simplifier.guardedResults.length;

            let finalPresentation = "EXECUTION_FAILED";
            try {
              finalPresentation = await renderKnowledgeResponseForRun(knowledge, run, simplifier);
            } catch {
              infrastructureValid = false;
            }

            const providerCalls = provider.invocationCount - providerBefore;
            const runtimeResult = runtime.observedResults[runtimeBefore] as any | undefined;
            const guardObserved = simplifier.guardedResults.length === guardBefore + 1;
            const guardResult = guardObserved ? simplifier.guardedResults[guardBefore] : null;
            const canonicalUnchanged = canonicalBefore === JSON.stringify(knowledge);
            const rawOutput = runtimeResult?.response?.output?.[0];
            const rawModelText = rawOutput?.type === "text" && typeof rawOutput.text === "string"
              ? rawOutput.text
              : null;
            const provenance = runtimeResult?.audit?.invocationProvenance;
            const modelAudit = provenance === undefined
              ? null
              : {
                  executionClass: provenance.executionClass,
                  routeMode: provenance.routeMode,
                  requestedProvider: provenance.requestedProvider,
                  requestedModel: provenance.requestedModel,
                  actualProvider: provenance.actualProvider,
                  actualModel: provenance.actualModel,
                  upstreamRequestId: provenance.upstreamRequestId,
                  routeProvenance: provenance.routeProvenance,
                };

            const routeValid = modelAudit !== null
              && modelAudit.executionClass === "LIVE_DIRECT"
              && modelAudit.routeMode === "PINNED"
              && modelAudit.requestedProvider === REQUESTED_PROVIDER
              && modelAudit.requestedModel === REQUESTED_MODEL
              && modelAudit.actualProvider === REQUESTED_PROVIDER
              && modelAudit.actualModel === REQUESTED_MODEL
              && modelAudit.routeProvenance === "COMPLETE";
            const invocationValid = providerCalls === 1
              && runtime.observedResults.length === runtimeBefore + 1
              && simplifier.guardedResults.length === guardBefore + 1;

            if (!routeValid || !invocationValid || !canonicalUnchanged || guardResult === null) {
              infrastructureValid = false;
            }

            evidenceCases.push({
              CASE: fixture.id,
              CANDIDATE_SHA,
              CANDIDATE_TREE,
              CANONICAL_FINDING: fixture.text,
              CANONICAL_STATUS: finding.status,
              CANONICAL_BASIS: finding.basis,
              RAW_MODEL_TEXT: rawModelText,
              GUARD_RESULT: guardResult === null ? "REJECTED" : guardResult,
              FINAL_SOLANDRA_PRESENTATION: finalPresentation,
              MODEL_AUDIT: modelAudit,
              CANONICAL_KNOWLEDGE_UNCHANGED: canonicalUnchanged,
            });
          }

          const evidence = {
            QUALIFICATION: "PR15_GROQ_SEMANTIC_GATE",
            FIXTURE_AUTHORITY: "SYNTHETIC_NON_SENSITIVE_NOT_REAL_WORLD_TRUTH",
            CANDIDATE_SHA,
            CANDIDATE_TREE,
            CASES: evidenceCases,
          };

          console.log("LATTICE_PR15_GROQ_SEMANTIC_EVIDENCE_BEGIN");
          console.log(JSON.stringify(evidence, null, 2));
          console.log("LATTICE_PR15_GROQ_SEMANTIC_EVIDENCE_END");

          if (!infrastructureValid) process.exitCode = 1;
          EOF

      - name: Execute one bounded live semantic gate
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [[ -z "${GROQ_API_KEY:-}" ]]; then
            echo "CREDENTIAL_SURFACE_BLOCKED"
            exit 2
          fi
          echo "CREDENTIAL_SURFACE_AVAILABLE"
          ./node_modules/.bin/tsx "$RUNNER_TEMP/pr15-groq-semantic-gate.mts"
