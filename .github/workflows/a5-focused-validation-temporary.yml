name: TEMP — A5 Focused Recovery Proof

on:
  push:
    branches:
      - validation/a5-focused
    paths:
      - ".github/workflows/a5-focused-validation-temporary.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ec7b1e118b783e768c99e76b82876dff786c02b6
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --import tsx --test test/a5-solandra-recovery-continuity.test.ts
