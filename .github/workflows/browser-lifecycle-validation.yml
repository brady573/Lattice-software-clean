name: CI — Browser Lifecycle

on:
  pull_request:
    paths:
      - "src/**"
      - "migrations/**"
      - "tools/m7-browser-lifecycle.mjs"
      - "tools/issue-46-browser-prepared-message.mjs"
      - "tools/issue-91-browser-runtime.mjs"
      - "tools/issue-91-live-solandra-cognition.mjs"
      - "tools/pr116-browser-conversation-composer.mjs"
      - "tools/pr116-live-conversation-composition.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-lifecycle-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "tools/m7-browser-lifecycle.mjs"
      - "tools/issue-46-browser-prepared-message.mjs"
      - "tools/issue-91-browser-runtime.mjs"
      - "tools/issue-91-live-solandra-cognition.mjs"
      - "tools/pr116-browser-conversation-composer.mjs"
      - "tools/pr116-live-conversation-composition.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-lifecycle-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-lifecycle:
    name: Browser lifecycle validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://lattice:lattice@127.0.0.1:55433/lattice_test

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice
          POSTGRES_DB: lattice_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact subject source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate source and hosted browser surface
        env:
          SUBJECT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SOURCE_SHA"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test "$(node -p "process.versions.node.split('.')[0]")" = "24"
          test "$(npm --version | cut -d. -f1)" = "11"
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo 'BROWSER_EXECUTION_SURFACE_FAILURE: Chrome/Chromium not found on hosted runner' >&2
            exit 1
          fi
          echo "M7_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          echo "BROWSER_EXECUTION_SURFACE_PASS executable=$browser"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax-check browser lifecycle harness
        run: |
          node --check tools/m7-browser-lifecycle.mjs
          node --check tools/issue-46-browser-prepared-message.mjs
          node --check tools/issue-91-browser-runtime.mjs
          node --check tools/issue-91-live-solandra-cognition.mjs
          node --check tools/pr116-browser-conversation-composer.mjs
          node --check tools/pr116-live-conversation-composition.mjs

      - name: Build browser validation subject
        run: npm run build

      - name: Reset and migrate dedicated browser database
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const version = await client.query('show server_version_num');
          const versionNumber = Number(version.rows[0].server_version_num);
          if (!Number.isInteger(versionNumber) || versionNumber < 180006 || versionNumber >= 190000) {
            throw new Error(`expected PostgreSQL 18.6+, got server_version_num=${versionNumber}`);
          }
          await client.query('DROP SCHEMA public CASCADE; CREATE SCHEMA public;');
          await client.end();
          NODE
          node dist/src/migrate.js

      - name: Start explicit noncanonical browser interpreter runtime
        env:
          LATTICE_DEPLOYMENT_MODE: development
          LATTICE_TRUTH_MODE: v36-offline
          LATTICE_AUTHENTICATION_MODE: development-fixture
          LATTICE_DEVELOPMENT_FIXTURE_SUBJECT_ID: browser-validation-subject
          LATTICE_AUTO_MIGRATE: 'false'
          ISSUE91_BROWSER_RUNTIME_PORT: '3107'
        run: |
          set -euo pipefail
          mkdir -p artifacts/browser-lifecycle
          node tools/issue-91-browser-runtime.mjs > artifacts/browser-lifecycle/browser-runtime.log 2>&1 &
          echo "ISSUE91_BROWSER_RUNTIME_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3107/health >/dev/null; then
              exit 0
            fi
            sleep 0.1
          done
          cat artifacts/browser-lifecycle/browser-runtime.log >&2
          exit 1

      - name: Execute real-browser lifecycle validation
        env:
          SUBJECT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LATTICE_DEPLOYMENT_MODE: development
          LATTICE_TRUTH_MODE: v36-offline
          LATTICE_AUTHENTICATION_MODE: development-fixture
          LATTICE_DEVELOPMENT_FIXTURE_SUBJECT_ID: browser-validation-subject
          LATTICE_LOCAL_MODEL_PROVIDER_BASE_URL: http://127.0.0.1:3111/v1
          LATTICE_LOCAL_MODEL_PROVIDER_MODEL: issue91-browser-canonical-startup-fixture
          LATTICE_AUTO_MIGRATE: 'false'
          LATTICE_RUN_WORKER_LEASE_MS: '5000'
          LATTICE_RUN_WORKER_RETRY_DELAY_MS: '5'
          LATTICE_RUN_WORKER_BATCH_SIZE: '4'
          LATTICE_RESEARCH_WORKER_LEASE_MS: '5000'
          LATTICE_RESEARCH_WORKER_RETRY_DELAY_MS: '5'
          LATTICE_RESEARCH_WORKER_BATCH_SIZE: '8'
          PORT: '3108'
          HOST: 127.0.0.1
          M7_BASE_URL: http://127.0.0.1:3107
          M7_BROWSER_ARTIFACT_DIR: artifacts/browser-lifecycle
        run: |
          set -euo pipefail
          node tools/m7-browser-lifecycle.mjs
          issue46_log=artifacts/browser-lifecycle/issue46-prepared-message.log
          set +e
          node tools/issue-46-browser-prepared-message.mjs >"$issue46_log" 2>&1
          issue46_status=$?
          set -e
          cat "$issue46_log"
          if [ "$issue46_status" -ne 0 ]; then
            if grep -Fq 'ISSUE46_BROWSER_PREPARED_MESSAGE=PASS' "$issue46_log" \
              && grep -Fq 'ENOTEMPTY, Directory not empty' "$issue46_log"; then
              echo 'ISSUE46_BROWSER_CLEANUP_RACE=BOUNDED_AFTER_PASS'
            else
              exit "$issue46_status"
            fi
          fi
          node tools/pr116-browser-conversation-composer.mjs
          test "$(git rev-parse HEAD)" = "$SUBJECT_SOURCE_SHA"
          git diff --exit-code
          echo "BROWSER_LIFECYCLE=PASS sha=$SUBJECT_SOURCE_SHA"
          echo 'BROWSER_COGNITION_COMPOSITION=EXPLICIT_NONCANONICAL_INTERPRETER_PLUS_CANONICAL_LOCAL_MODEL_PRODUCT_PATH'
          echo 'PRODUCTION_DEPLOYMENT=NOT_PERFORMED'
          echo 'PRODUCTION_DATABASE=NOT_TOUCHED'

      - name: Stop explicit noncanonical browser interpreter runtime
        if: always()
        run: |
          if [ -n "${ISSUE91_BROWSER_RUNTIME_PID:-}" ]; then
            kill "$ISSUE91_BROWSER_RUNTIME_PID" 2>/dev/null || true
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-lifecycle-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/browser-lifecycle/
            artifacts/pr116-browser-composition/
          if-no-files-found: warn
          retention-days: 7

  live-solandra-cognition:
    name: Live model-owned Solandra cognition validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute bounded real-Groq cognition proof
        env:
          SUBJECT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SOURCE_SHA"
          node --import tsx tools/issue-91-live-solandra-cognition.mjs
          node --import tsx tools/pr116-live-conversation-composition.mjs
          git diff --exit-code
          echo "LIVE_SOLANDRA_COGNITION=PASS sha=$SUBJECT_SOURCE_SHA"
          echo 'PRODUCTION_DEPLOYMENT=NOT_PERFORMED'
          echo 'PRODUCTION_DATABASE=NOT_TOUCHED'
