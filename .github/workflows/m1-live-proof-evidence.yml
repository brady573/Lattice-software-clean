name: M1 Live Proof Evidence

on:
  push:
    branches:
      - evidence/m1-live-proof-fc0f987

permissions:
  contents: read

jobs:
  live-proof:
    name: Frozen M1 live Product proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout evidence harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: evidence
          persist-credentials: false

      - name: Checkout frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 959d5e8de51395e1ed4dc8e9fed28729543234b3
          path: candidate
          persist-credentials: false

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install frozen candidate dependencies
        working-directory: candidate
        run: npm ci --no-audit --no-fund

      - name: Build frozen candidate
        working-directory: candidate
        run: npm run build

      - name: Diagnose real Solandra cognition output
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          FROZEN_SHA: 959d5e8de51395e1ed4dc8e9fed28729543234b3
          FROZEN_TREE: c30cce49a76c4fadbc1505b8a2c3374bfbe3e2ee
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node evidence/evidence/m1-live-diagnostic.mjs
