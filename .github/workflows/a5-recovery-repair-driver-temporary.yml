name: TEMP A5 Recovery Repair Driver

on:
  push:
    branches:
      - validation/a5-recovery-repair-driver
    paths:
      - ".github/workflows/a5-recovery-repair-driver-temporary.yml"
      - "validation/a5-recovery-repair-driver.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: validation/a5-recovery-repair-driver
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/a5-solandra-recovery-continuity
          path: subject
          fetch-depth: 0
      - name: Verify exact starting subject
        working-directory: subject
        run: |
          test "$(git rev-parse HEAD)" = "ec7b1e118b783e768c99e76b82876dff786c02b6"
          test "$(git rev-parse HEAD^{tree})" = "96c0cb250023a7f85ff690df6ded1a3e4bf38537"
      - name: Apply bounded browser recovery repair
        working-directory: subject
        run: |
          python ../driver/validation/a5-recovery-repair-driver.py
          git diff --check
          git diff -- src/ui/solandra-conversation-page.ts test/a5-solandra-recovery-continuity.test.ts
      - name: Commit Product repair
        working-directory: subject
        run: |
          git config user.name "brady573"
          git config user.email "114089255+brady573@users.noreply.github.com"
          git add src/ui/solandra-conversation-page.ts test/a5-solandra-recovery-continuity.test.ts
          git commit -m "A5: close recovery handoff and draft isolation gaps"
          git push origin HEAD:feature/a5-solandra-recovery-continuity
          echo "PRODUCT_SHA=$(git rev-parse HEAD)"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})"
