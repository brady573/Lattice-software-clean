name: Validation — Issue 91 Wikimedia Partial Repair

on:
  push:
    branches:
      - validation/issue-91-wikimedia-partial-repair-20260913
    paths:
      - tools/apply-issue91-wikimedia-partial-repair.py
      - .github/workflows/issue91-wikimedia-partial-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue91-wikimedia-partial-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Patch, validate, and stage bounded Product candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_BASE_SHA: eb495880342e3990f368cee99a28a824d235934b
      EXPECTED_BASE_TREE: da839ff38527db3558fb48f0d7be7704b9771706
      PRODUCT_BRANCH: issue-91/wikimedia-partial-acquisition

    steps:
      - name: Checkout validation infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: validation/issue-91-wikimedia-partial-repair-20260913
          path: validation-infrastructure
          persist-credentials: false

      - name: Checkout Product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-91/wikimedia-partial-acquisition
          path: product
          fetch-depth: 2
          persist-credentials: true

      - name: Verify fresh canonical base
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_BASE_TREE"
          test -z "$(git status --porcelain)"
          echo "BASE_SHA=$EXPECTED_BASE_SHA"
          echo "BASE_TREE=$EXPECTED_BASE_TREE"
          echo "FRESH_BASE=VERIFIED"

      - name: Apply bounded repair
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          python ../validation-infrastructure/tools/apply-issue91-wikimedia-partial-repair.py
          git diff --check
          git status --short

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        working-directory: product
        run: npm ci --no-audit --no-fund

      - name: Build exact patched tree
        working-directory: product
        run: npm run build

      - name: Run focused acquisition and boundary tests
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test test/issues-56-57-wikimedia-provider.test.ts
          node --import tsx --test test/knowledge-semantic-investigation-boundary.test.ts
          node --import tsx --test test/issue-91-partial-acquisition-boundary.test.ts
          node --import tsx --test test/knowledge-consultation-v01.test.ts
          node --import tsx --test test/solandra-knowledge-response.test.ts

      - name: Commit validated Product candidate
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          git config user.name "brady573"
          git config user.email "114089255+brady573@users.noreply.github.com"
          git add src/knowledge/acquisition.ts \
                  src/knowledge/investigation.ts \
                  src/knowledge/wikimedia-acquisition.ts \
                  src/truth/knowledge-acquisition-pipeline.ts \
                  src/outcome.ts \
                  src/presentation/solandra/knowledge-response.ts \
                  test/issues-56-57-wikimedia-provider.test.ts \
                  test/issue-91-partial-acquisition-boundary.test.ts
          git commit -m "Preserve partial Wikimedia acquisition"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo "MERGE=NOT_PERFORMED"
          echo "DEPLOYMENT=NOT_PERFORMED"
