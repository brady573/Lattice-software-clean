# Evidence-only workflow for frozen PR #11 semantic proof.
name: Evidence — NVIDIA Investigation Planner Semantic Corpus

on:
  push:
    branches:
      - evidence/nvidia-semantic-corpus-pr11-5608ae5

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: 5608ae5bdf1500d7d1427c7375b326c82c8bdf23
      EXPECTED_TREE: d8aa91a501495b4a87e550a6856f74d5d935ec61
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Checkout evidence harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact frozen PR subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5608ae5bdf1500d7d1427c7375b326c82c8bdf23
          path: subject
          persist-credentials: false

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: subject/package-lock.json

      - name: Verify exact frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C subject rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C subject rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -n "$NVIDIA_API_KEY"

      - name: Install locked dependencies
        working-directory: subject
        run: npm ci

      - name: Build exact subject
        working-directory: subject
        run: npm run build

      - name: Run remaining 13 plus 1 held-out NVIDIA evidence set
        run: |
          node tools/evidence-nvidia-semantic-corpus.mjs \
            --subject-root subject \
            --suite evidence/nvidia-semantic-remaining-v0.1.json \
            --output-dir evidence-output

      - name: Hash preserved evidence
        if: always()
        shell: bash
        run: |
          if [ -d evidence-output ]; then
            sha256sum evidence-output/*.json | tee evidence-output/SHA256SUMS.txt
          fi

      - name: Upload complete preserved evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: investigation-planner-nvidia-semantic-remaining-13-plus-1
          path: evidence-output/
          if-no-files-found: error
          retention-days: 7
