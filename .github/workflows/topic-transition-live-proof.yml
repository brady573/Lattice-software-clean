name: Validation — Topic Transition Live Proof

on:
  push:
    branches:
      - repair/conversation-topic-transition
    paths:
      - "src/solandra/cognition.ts"
      - "tools/topic-transition-live-proof.mjs"
      - ".github/workflows/topic-transition-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-topic-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://lattice:lattice@127.0.0.1:55433/lattice_test
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice
          POSTGRES_DB: lattice_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact branch subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Verify live proof capability
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY"
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          echo "M7_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          echo "TOPIC_TRANSITION_LIVE_PROOF_SHA=$(git rev-parse HEAD)"

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Reset and migrate disposable PostgreSQL
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query('DROP SCHEMA public CASCADE; CREATE SCHEMA public;');
          await client.end();
          NODE
          node dist/src/migrate.js

      - name: Execute real cognition and Chrome Product proof
        run: node tools/topic-transition-live-proof.mjs
