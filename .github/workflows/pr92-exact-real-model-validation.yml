name: Validation — PR 92 Exact Real Model

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr92-exact-real-model-validation.yml

permissions:
  contents: read

concurrency:
  group: pr92-exact-real-model-validation
  cancel-in-progress: false

jobs:
  exact-real-model:
    name: Exact-candidate real-model evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PRODUCT_SHA: e589b343e8ce6b517490fda59008cd456a0624c0
      EXPECTED_PRODUCT_TREE: 24e64fb796a0f608743cda7b65edd9385d480cb3

    steps:
      - name: Checkout temporary validation infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: validation/pr92-exact-real-model-20260913
          path: validation-infrastructure
          persist-credentials: false

      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e589b343e8ce6b517490fda59008cd456a0624c0
          path: product
          persist-credentials: false

      - name: Verify exact Product candidate
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          echo "PRODUCT_SHA=$EXPECTED_PRODUCT_SHA"
          echo "PRODUCT_TREE=$EXPECTED_PRODUCT_TREE"
          echo "EXACT_CANDIDATE=VERIFIED"

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies and build exact Product
        working-directory: product
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Stage validation-only helper outside Product history
        shell: bash
        run: |
          set -euo pipefail
          cp validation-infrastructure/tools/pr92-exact-real-model-validation.mjs \
            product/tools/pr92-exact-real-model-validation.mjs

      - name: Execute configured Groq route and missing Knowledge journey
        working-directory: product
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LATTICE_DEPLOYMENT_MODE: development
          LATTICE_TRUTH_MODE: v36-live
          LATTICE_AUTHENTICATION_MODE: development-fixture
          LATTICE_DEVELOPMENT_FIXTURE_SUBJECT_ID: pr92-exact-real-model-validator
          LATTICE_SOLANDRA_COGNITION_ROUTE: groq-gpt-oss-120b
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}"
          echo "GROQ_API_KEY=CONFIGURED_NOT_EXPOSED"
          node tools/pr92-exact-real-model-validation.mjs
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "PRODUCT_CANDIDATE_REMAINS_UNCHANGED=YES"
          echo "SECRET_OUTPUT=PROHIBITED"
          echo "DEPLOYMENT=NOT_PERFORMED"

      - name: Upload bounded Steward evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr92-exact-real-model-evidence
          path: artifacts/pr92-real-model/
          if-no-files-found: warn
          retention-days: 14
