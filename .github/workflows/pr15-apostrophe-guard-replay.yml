name: Temporary PR #15 apostrophe guard replay

on:
  push:
    branches:
      - qualification/pr15-apostrophe-guard-replay

permissions:
  contents: read

jobs:
  focused-replay:
    name: Frozen PR #15 guard replay
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact repaired candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5fa1255f57f6a1b4db15c9b0e7221e018feff4ce
          persist-credentials: false

      - name: Verify exact repaired candidate
        shell: bash
        env:
          CANDIDATE_SHA: 5fa1255f57f6a1b4db15c9b0e7221e018feff4ce
          CANDIDATE_TREE: 97a24017c0661eb44f41fff5d6ae1a6f2348ba54
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$actual_sha" == "$CANDIDATE_SHA" ]] || { echo "CANDIDATE_SHA_MISMATCH" >&2; exit 1; }
          [[ "$actual_tree" == "$CANDIDATE_TREE" ]] || { echo "CANDIDATE_TREE_MISMATCH" >&2; exit 1; }
          printf 'CANDIDATE_SHA=%s\n' "$actual_sha"
          printf 'CANDIDATE_TREE=%s\n' "$actual_tree"

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Run focused simplification guard and presentation tests
        shell: bash
        run: node --import tsx --test test/knowledge-simplification.test.ts test/knowledge-simplification-typography.test.ts

      - name: Generate deterministic preserved-output replay runner
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pr15-apostrophe-replay.mts" <<'EOF'
          import assert from "node:assert/strict";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          const CANDIDATE_SHA = "5fa1255f57f6a1b4db15c9b0e7221e018feff4ce";
          const CANDIDATE_TREE = "97a24017c0661eb44f41fff5d6ae1a6f2348ba54";
          const FOLLOW_UP = "Put that in plain language.";
          const SOURCE_REPORT_SUFFIX =
            "This status concerns what the retrieved source material reports; it does not independently verify the broader real-world claim.";
          const workspace = process.env.GITHUB_WORKSPACE;
          if (!workspace) throw new Error("GITHUB_WORKSPACE is unavailable.");
          const moduleUrl = (relativePath: string): string => pathToFileURL(join(workspace, relativePath)).href;

          const simplificationModule = await import(
            moduleUrl("src/presentation/solandra/knowledge-simplification.ts")
          );
          const responseModule = await import(
            moduleUrl("src/presentation/solandra/knowledge-response.ts")
          );
          const { validateKnowledgeSimplification } = simplificationModule;
          const { renderKnowledgeResponseForRun } = responseModule;

          const cases = Object.freeze([
            Object.freeze({
              id: "A",
              canonical:
                "The semiconductor's depletion region widens under reverse bias because the applied potential increases the built-in electric field and drives majority carriers away from the junction.",
              raw:
                "When reverse bias is applied, the depletion region widens because the voltage increases the built‑in electric field and pushes majority carriers away from the junction.",
              accepted:
                "When reverse bias is applied, the depletion region widens because the voltage increases the built‑in electric field and pushes majority carriers away from the junction.",
            }),
            Object.freeze({
              id: "B",
              canonical:
                "The available measurements do not establish that additive Q causes the observed failure; they suggest only a possible association.",
              raw:
                "The measurements we have don’t show that additive Q causes the failure; they only suggest a possible association.",
              accepted:
                "The measurements we have don’t show that additive Q causes the failure; they only suggest a possible association.",
            }),
            Object.freeze({
              id: "C",
              canonical:
                "The reported efficiency gain applies only when the device operates below 40 °C under continuous load; performance under intermittent load was not evaluated.",
              raw:
                "The efficiency gain is only valid when the device runs continuously at temperatures below 40 °C; performance under intermittent load was not evaluated.",
              accepted:
                "The efficiency gain is only valid when the device runs continuously at temperatures below 40 °C; performance under intermittent load was not evaluated.",
            }),
          ]);

          class PreservedOutputSimplifier {
            results: Array<string | null> = [];
            constructor(private readonly rawText: string) {}
            async simplify(input: any): Promise<string | null> {
              const result = validateKnowledgeSimplification(input.finding.text, this.rawText);
              this.results.push(result);
              return result;
            }
          }

          const records: unknown[] = [];
          for (const fixture of cases) {
            const finding = {
              claimId: `synthetic-preserved-live-${fixture.id}`,
              text: fixture.canonical,
              status: "UNRESOLVED",
              confidence: "LOW",
              evidenceIds: [`synthetic-evidence-${fixture.id}`],
              contradictoryEvidenceIds: [],
              temporalQualifiers: { effectiveAt: null, period: null },
              basis: "SOURCE_REPORT",
            };
            const knowledge = {
              kind: "KNOWLEDGE",
              objective: "Synthetic preserved live-output replay; factual content is not asserted as real-world truth.",
              acceptedUnderstanding:
                "Synthetic preserved live-output replay; factual content is not asserted as real-world truth.",
              findings: [finding],
              uncertainties: ["Synthetic semantic fixture only."],
              provenance: [],
              truthAssessmentIds: [],
            };
            const run = {
              id: `synthetic-preserved-live-run-${fixture.id}`,
              conversationId: "synthetic-preserved-live-conversation",
              status: "COMPLETED",
              version: 1,
              request: {
                kind: "consultation",
                objective: knowledge.objective,
                context: [FOLLOW_UP],
                decisionNeed: "NONE",
                resourceNeed: "NONE",
                sourceMessageId: `synthetic-preserved-live-message-${fixture.id}`,
                sourceMessageDigest: "0".repeat(64),
                intentVersion: 1,
              },
              decision: null,
              explanation: null,
              truthAssessmentIds: [],
              events: [],
            };
            const before = JSON.stringify(knowledge);
            const simplifier = new PreservedOutputSimplifier(fixture.raw);
            const presentation = await renderKnowledgeResponseForRun(knowledge, run, simplifier);
            assert.equal(simplifier.results.length, 1);
            const guardResult = simplifier.results[0] ?? null;
            const canonicalUnchanged = before === JSON.stringify(knowledge);

            assert.equal(guardResult, fixture.accepted);
            assert.equal(
              presentation,
              `Unresolved as a source report: ${fixture.accepted} ${SOURCE_REPORT_SUFFIX}`,
            );
            assert.equal(canonicalUnchanged, true);

            records.push({
              CASE: fixture.id,
              CANDIDATE_SHA,
              CANDIDATE_TREE,
              CANONICAL_FINDING: fixture.canonical,
              PRESERVED_LIVE_RAW_TEXT: fixture.raw,
              GUARD_RESULT: guardResult,
              FINAL_SOLANDRA_PRESENTATION: presentation,
              CANONICAL_KNOWLEDGE_UNCHANGED: canonicalUnchanged,
            });
          }

          console.log("LATTICE_PR15_DETERMINISTIC_REPLAY_BEGIN");
          console.log(JSON.stringify({ CANDIDATE_SHA, CANDIDATE_TREE, CASES: records }, null, 2));
          console.log("LATTICE_PR15_DETERMINISTIC_REPLAY_END");
          EOF

      - name: Replay preserved A B C outputs without provider calls
        shell: bash
        run: ./node_modules/.bin/tsx "$RUNNER_TEMP/pr15-apostrophe-replay.mts"
