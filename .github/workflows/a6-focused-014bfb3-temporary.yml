name: TEMP A6 Focused Evaluator Reconciliation

on:
  push:
    branches:
      - validation/a6-focused-014bfb3
    paths:
      - ".github/workflows/a6-focused-014bfb3-temporary.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d753f7b4d70d05b358c8c81100ea219cbf41d848
          persist-credentials: false
      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d753f7b4d70d05b358c8c81100ea219cbf41d848"
          test "$(git rev-parse HEAD^{tree})" = "2379a2615f4c1fc96ea05d55933b21cc08d8520e"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run focused reconciliation only
        run: >-
          node --import tsx --test
          test/core-philosophy-reconciliation.test.ts
          test/m1-solandra-cognitive-knowledge-spine.test.ts
          test/m7-authoritative-lifecycle-ui.test.ts
