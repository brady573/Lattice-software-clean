name: TEMP A6 Exact Core Validation

on:
  push:
    branches:
      - validation/a6-focused-014bfb3
    paths:
      - ".github/workflows/a6-focused-014bfb3-temporary.yml"

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  core-validation:
    name: Core PR validation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d753f7b4d70d05b358c8c81100ea219cbf41d848
          persist-credentials: false
      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Validate source and runtime contract
        env:
          SUBJECT_SOURCE_SHA: d753f7b4d70d05b358c8c81100ea219cbf41d848
          SUBJECT_TREE_SHA: 2379a2615f4c1fc96ea05d55933b21cc08d8520e
        run: |
          @echo off
          setlocal EnableExtensions
          for /f %%I in ('git rev-parse HEAD') do set "ACTUAL_SOURCE_SHA=%%I"
          if /I not "%ACTUAL_SOURCE_SHA%"=="%SUBJECT_SOURCE_SHA%" exit /b 1
          for /f %%I in ('git rev-parse HEAD^^{tree}') do set "ACTUAL_TREE_SHA=%%I"
          if /I not "%ACTUAL_TREE_SHA%"=="%SUBJECT_TREE_SHA%" exit /b 1
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if /I not "%RUNNER_ARCH%"=="X64" exit /b 1
          for /f %%I in ('node -p "process.versions.node.split('.')[0]"') do set "NODE_MAJOR=%%I"
          if not "%NODE_MAJOR%"=="24" exit /b 1
          for /f "tokens=1 delims=." %%I in ('npm --version') do set "NPM_MAJOR=%%I"
          if not "%NPM_MAJOR%"=="11" exit /b 1
          if not exist package-lock.json exit /b 1
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run repository check
        run: npm run check
      - name: Record bounded core validation
        run: |
          @echo off
          for /f %%I in ('git rev-parse HEAD') do set "VALIDATED_SHA=%%I"
          echo CORE_PR_VALIDATION=PASS sha=%VALIDATED_SHA%
          echo REPOSITORY_CHECK=PASS command=npm run check
          echo POSTGRES_INTEGRATION=NOT_CLAIMED_BY_CORE_LANE
          echo BROWSER_E2E=NOT_CLAIMED_BY_CORE_LANE
