name: TEMP A5 PostgreSQL b961ef8

on:
  push:
    branches:
      - validation/a5-postgres-proof-b961ef8
    paths:
      - ".github/workflows/a5-postgres-proof-b961ef8-temporary.yml"

permissions:
  contents: read

jobs:
  postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://lattice:lattice@127.0.0.1:55433/lattice_test
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice
          POSTGRES_DB: lattice_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b961ef8b7df1245a224ee173aecac2f60a9428b4
          path: subject
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7c80b16674dd0ce478a6172bc390aefa19538059
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify frozen Product subject
        working-directory: subject
        run: |
          test "$(git rev-parse HEAD)" = "b961ef8b7df1245a224ee173aecac2f60a9428b4"
          test "$(git rev-parse HEAD^{tree})" = "61d34a3ff612ceab26043f1f377826aeb066a635"
      - name: Install and build frozen subject
        working-directory: subject
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Reset dedicated PostgreSQL schema
        working-directory: subject
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query('DROP SCHEMA public CASCADE; CREATE SCHEMA public;');
          const version = await client.query('show server_version_num');
          await client.end();
          const number = Number(version.rows[0].server_version_num);
          if (!Number.isInteger(number) || number < 180006 || number >= 190000) {
            throw new Error(`expected PostgreSQL 18.6+, got ${number}`);
          }
          console.log(`A5_PG_SERVICE=PASS version=${number}`);
          NODE
      - name: Run A5 PostgreSQL recomposition proof
        working-directory: subject
        run: node ../harness/validation/a5-postgres-recomposition-proof.mjs
