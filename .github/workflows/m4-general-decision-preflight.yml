name: TEMP M4 Candidate Validation

on:
  push:
    branches:
      - validation/m4-general-decision-journey
    paths:
      - ".github/workflows/m4-general-decision-preflight.yml"

permissions:
  contents: read

jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUBJECT_SHA: 8dca14233908988604fcbbf3f1a32e2f0a4b4a16
      SUBJECT_TREE: 6d7962927b6af47d75a74818f1d116a8c819664c
      DATABASE_URL: postgresql://lattice:lattice@127.0.0.1:55433/lattice_test
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice
          POSTGRES_DB: lattice_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8dca14233908988604fcbbf3f1a32e2f0a4b4a16
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Focused M4 memory acceptance
        run: node --import tsx --test test/m4-general-decision-journey.test.ts
      - name: Reset PostgreSQL schema
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query('DROP SCHEMA public CASCADE; CREATE SCHEMA public;');
          await client.end();
          NODE
      - name: M4 and invalidated Recommendation PostgreSQL acceptance
        run: node --import tsx --test --test-concurrency=1 test/m4-postgres-decision-continuity.test.ts test/m2-postgres-recommendation-restart.test.ts test/runtime-schema-readiness-postgres.test.ts
      - name: Invalidated Solandra advisory regression
        run: env -u DATABASE_URL node --import tsx --test test/m2-solandra-advisory-spine.test.ts test/m3-solandra-action-preparation.test.ts
      - name: Ordinary Core
        run: env -u DATABASE_URL npm run check
      - name: Verify exact candidate unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
