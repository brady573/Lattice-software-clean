name: TEMP M4 Diagnostic Candidate Validation

on:
  push:
    branches:
      - validation/m4-general-decision-journey
    paths:
      - ".github/workflows/m4-general-decision-preflight.yml"

permissions:
  contents: read

jobs:
  diagnostic-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUBJECT_SHA: f1189f41d976b3c9c57336289ee793f7f78f58ca
      SUBJECT_TREE: 73c7b42027a8300724c2a32155d0457d19ebe665
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f1189f41d976b3c9c57336289ee793f7f78f58ca
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify exact candidate and credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          test -n "${GROQ_API_KEY:-}"
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Diagnostic observability and invalidated M4 acceptance
        run: node --import tsx --test test/m4-advisory-diagnostic-observability.test.ts test/m2-solandra-advisory-spine.test.ts test/m4-general-decision-journey.test.ts
      - name: Ordinary Core
        run: env -u DATABASE_URL npm run check
      - name: Exactly one public configured-model diagnostic execution
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          import { createRuntimeApp } from './dist/src/runtime-app.js';
          import { resolveRuntimeConfig } from './dist/src/runtime-config.js';
          import {
            GROQ_KNOWLEDGE_SIMPLIFIER_MODEL,
            GroqKnowledgeSimplifierModelProvider,
            GroqKnowledgeSimplifierModelRuntime,
          } from './dist/src/model/groq-knowledge-simplifier.js';
          import { ModelSolandraCognitiveRuntime } from './dist/src/solandra/cognition.js';
          import { ModelSolandraAdvisoryRuntime } from './dist/src/solandra/advisory.js';
          import { ModelSolandraActionPreparer } from './dist/src/solandra/action-preparer.js';
          import { ModelSolandraKnowledgePresenter } from './dist/src/solandra/knowledge-presenter.js';

          const PUBLIC_DEVELOPMENT_PROBE = "I’m choosing between naming a private scratch folder ‘Workbench’ or ‘Later’. I prefer the shorter, quieter label. Help me choose based only on that preference.";
          const diagnostics = [];
          const config = resolveRuntimeConfig({
            ...process.env,
            LATTICE_DEPLOYMENT_MODE: 'development',
            LATTICE_TRUTH_MODE: 'v36-offline',
            LATTICE_AUTHENTICATION_MODE: 'development-fixture',
            LATTICE_DEVELOPMENT_FIXTURE_SUBJECT_ID: 'm4-public-live-user',
            LATTICE_SOLANDRA_COGNITION_ROUTE: 'groq-gpt-oss-120b',
          });
          assert.equal(config.solandraCognitionRoute, 'groq-gpt-oss-120b');
          const provider = new GroqKnowledgeSimplifierModelProvider({
            apiKey: config.solandraCognitionApiKey,
            diagnosticSink: (diagnostic) => diagnostics.push(diagnostic),
          });
          const runtime = new GroqKnowledgeSimplifierModelRuntime(provider);
          const app = await createRuntimeApp(config, {
            memoryDispatchDelayMs: 1,
            solandraCognition: new ModelSolandraCognitiveRuntime(runtime, GROQ_KNOWLEDGE_SIMPLIFIER_MODEL),
            solandraAdvisory: new ModelSolandraAdvisoryRuntime(runtime, GROQ_KNOWLEDGE_SIMPLIFIER_MODEL),
            solandraActionPreparer: new ModelSolandraActionPreparer(runtime, GROQ_KNOWLEDGE_SIMPLIFIER_MODEL),
            solandraKnowledgePresenter: new ModelSolandraKnowledgePresenter(runtime, GROQ_KNOWLEDGE_SIMPLIFIER_MODEL),
          });

          function classify(content) {
            const trimmed = content.trim();
            const unfenced = /^```(?:json)?\s*([\s\S]*?)\s*```$/iu.exec(trimmed)?.[1] ?? trimmed;
            try {
              const parsed = JSON.parse(unfenced);
              if (Array.isArray(parsed)) return { class: parsed.length === 1 ? 'JSON_SINGLE_ARRAY' : 'JSON_MULTI_ARRAY', parsed };
              if (parsed !== null && typeof parsed === 'object') return { class: 'JSON_OBJECT', parsed };
              return { class: 'JSON_NON_OBJECT', parsed };
            } catch (error) {
              return { class: 'JSON_SYNTAX_ERROR', error: error instanceof Error ? error.message : String(error) };
            }
          }

          let response;
          try {
            const created = await app.inject({ method: 'POST', url: '/api/v1/conversations' });
            assert.equal(created.statusCode, 201, created.body);
            const conversationId = created.json().conversation.id;
            response = await app.inject({
              method: 'POST',
              url: `/api/v1/conversations/${conversationId}/turns`,
              payload: { turnId: randomUUID(), message: PUBLIC_DEVELOPMENT_PROBE },
            });
            const classified = diagnostics.map((diagnostic, index) => ({
              index,
              finishReason: diagnostic.finishReason,
              promptTokens: diagnostic.promptTokens,
              completionTokens: diagnostic.completionTokens,
              totalTokens: diagnostic.totalTokens,
              upstreamRequestId: diagnostic.upstreamRequestId,
              content: diagnostic.content,
              structural: classify(diagnostic.content),
            }));
            console.log('LATTICE_M4_DIAGNOSTIC=' + JSON.stringify(classified));
            console.log('LATTICE_M4_PRODUCT_RESPONSE=' + response.body);
            assert.equal(response.statusCode, 200, response.body);
            const body = response.json();
            assert.equal(body.status, 'RECOMMENDATION_ESTABLISHED');
            assert.equal(body.interpretation?.requestedHelp, 'DECISION');
            assert.equal(body.recommendationReference?.selectionAuthorized, false);
            assert.ok(Array.isArray(body.recommendationReference?.options) && body.recommendationReference.options.length >= 2);
            assert.ok(classified.length >= 3, 'Expected cognition, advisory, and grounding completions.');
            assert.equal(classified[1].structural.class === 'JSON_OBJECT' || classified[1].structural.class === 'JSON_SINGLE_ARRAY', true);
            assert.equal(classified[2].structural.class === 'JSON_OBJECT' || classified[2].structural.class === 'JSON_SINGLE_ARRAY', true);
            console.log('LATTICE_M4_PUBLIC_LIVE_DECISION=PASS');
          } finally {
            await app.close();
          }
          NODE
      - name: Verify exact candidate unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
