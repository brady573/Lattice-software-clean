name: TEMP M4 General Decision Preflight

on:
  push:
    branches:
      - validation/m4-general-decision-journey
    paths:
      - ".github/workflows/m4-general-decision-preflight.yml"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/m4-general-decision-journey
          fetch-depth: 1
      - name: Verify untouched M4 base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "654701d6794db0293963be062ec54e3f782cf5e0"
          test "$(git rev-parse HEAD^{tree})" = "1db6a07e8f2e4743c36f408f980c2d99f4da3112"
      - name: Checkout validation patcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: validation/m4-general-decision-journey
          path: _validation
          persist-credentials: false
      - name: Apply bounded M4 patch
        run: python _validation/validation/m4-apply.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Build candidate
        run: npm run build
      - name: Focused M4 memory acceptance
        run: node --import tsx --test test/m4-general-decision-journey.test.ts
      - name: Inspect bounded diff
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git diff --name-only
      - name: Commit and push Product candidate
        run: |
          set -euo pipefail
          git config user.name "Lattice Coding Agent"
          git config user.email "114089255+brady573@users.noreply.github.com"
          git add migrations/037_m4_general_decision_journey.sql src/recommendation/recommendation-options.ts src/intent/accepted-choice-store.ts src/recommendation/recommendation-store.ts src/recommendation/recommendation-continuity.ts src/solandra/advisory.ts src/solandra/cognition.ts src/consultation-intake.ts src/conversation/continuity-api.ts src/runtime-app.ts src/ui/solandra-conversation-page.ts test/m4-general-decision-journey.test.ts test/m4-postgres-decision-continuity.test.ts
          git commit -m "M4: establish general decision continuity"
          git push origin HEAD:feature/m4-general-decision-journey
