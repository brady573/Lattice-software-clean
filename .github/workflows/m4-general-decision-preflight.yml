name: TEMP M4 Advisory Framing Diagnostic

on:
  push:
    branches:
      - validation/m4-general-decision-journey
    paths:
      - ".github/workflows/m4-general-decision-preflight.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUBJECT_SHA: 8dca14233908988604fcbbf3f1a32e2f0a4b4a16
      SUBJECT_TREE: 6d7962927b6af47d75a74818f1d116a8c819664c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8dca14233908988604fcbbf3f1a32e2f0a4b4a16
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify subject and credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          test -n "${GROQ_API_KEY:-}"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Classify advisory output framing without exposing output
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          import { createRuntimeApp } from './dist/src/runtime-app.js';
          import { resolveRuntimeConfig } from './dist/src/runtime-config.js';
          import { createConfiguredSolandraCognition } from './dist/src/solandra/cognition-composition.js';

          const message = "I’m choosing between naming a private scratch folder ‘Workbench’ or ‘Later’. I prefer the shorter, quieter label. Help me choose based only on that preference.";
          const config = resolveRuntimeConfig({ ...process.env, LATTICE_DEPLOYMENT_MODE:'development', LATTICE_TRUTH_MODE:'v36-offline', LATTICE_AUTHENTICATION_MODE:'development-fixture', LATTICE_DEVELOPMENT_FIXTURE_SUBJECT_ID:'m4-public-live-user', LATTICE_SOLANDRA_COGNITION_ROUTE:'groq-gpt-oss-120b' });
          const solandra = createConfiguredSolandraCognition(config);
          if (!solandra) throw new Error('configured Solandra missing');
          const advisory = solandra.advisory;
          const runtime = advisory.runtime;
          const originalCall = runtime.call.bind(runtime);
          runtime.call = async (...args) => {
            const result = await originalCall(...args);
            const text = result.response.output.filter((item) => item.type === 'text').map((item) => item.text).join('\n');
            const trimmed = text.trim();
            let rawJson = false;
            try { JSON.parse(trimmed); rawJson = true; } catch {}
            const fenceMatch = /^```(?:json)?\s*([\s\S]*?)\s*```$/iu.exec(trimmed);
            let fencedJson = false;
            if (fenceMatch?.[1]) { try { JSON.parse(fenceMatch[1]); fencedJson = true; } catch {} }
            const first = trimmed.indexOf('{');
            const last = trimmed.lastIndexOf('}');
            let embeddedJson = false;
            if (first >= 0 && last > first) { try { JSON.parse(trimmed.slice(first, last + 1)); embeddedJson = true; } catch {} }
            console.log(JSON.stringify({ outputLength: text.length, rawJson, fencedJson, embeddedJson, startsWithBrace: trimmed.startsWith('{'), endsWithBrace: trimmed.endsWith('}'), prefixChars: first }));
            return result;
          };
          const app = await createRuntimeApp(config, { memoryDispatchDelayMs:1, solandraCognition:solandra.cognition, solandraAdvisory:advisory, solandraActionPreparer:solandra.actionPreparer, solandraKnowledgePresenter:solandra.knowledgePresenter });
          try {
            const created = await app.inject({ method:'POST', url:'/api/v1/conversations' });
            const conversationId = created.json().conversation.id;
            const response = await app.inject({ method:'POST', url:`/api/v1/conversations/${conversationId}/turns`, payload:{ turnId:randomUUID(), message } });
            console.log(JSON.stringify({ statusCode: response.statusCode, productError: response.json().error ?? null }));
          } finally { await app.close(); }
          NODE
      - name: Verify candidate unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
