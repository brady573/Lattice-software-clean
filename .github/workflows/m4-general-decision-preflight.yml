name: TEMP M4 Advisory Framing Repair

on:
  push:
    branches:
      - validation/m4-general-decision-journey
    paths:
      - ".github/workflows/m4-general-decision-preflight.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/m4-general-decision-journey
          fetch-depth: 1
      - name: Verify pre-repair subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8dca14233908988604fcbbf3f1a32e2f0a4b4a16"
          test "$(git rev-parse HEAD^{tree})" = "6d7962927b6af47d75a74818f1d116a8c819664c"
      - name: Checkout validation patcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: validation/m4-general-decision-journey
          path: _validation
          persist-credentials: false
      - name: Apply framing repair
        run: python _validation/validation/m4-advisory-framing-repair.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Build repaired candidate
        run: npm run build
      - name: Invalidated advisory and M4 focused acceptance
        run: node --import tsx --test test/m2-solandra-advisory-spine.test.ts test/m4-general-decision-journey.test.ts
      - name: Inspect exact repair scope
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/solandra/advisory.ts test/m2-solandra-advisory-spine.test.ts "
      - name: Commit and push repair
        run: |
          set -euo pipefail
          git config user.name "Lattice Coding Agent"
          git config user.email "114089255+brady573@users.noreply.github.com"
          git add src/solandra/advisory.ts test/m2-solandra-advisory-spine.test.ts
          git commit -m "M4: tolerate single-object advisory framing"
          git push origin HEAD:feature/m4-general-decision-journey
