name: TEMP M4 Public Live Model Proof

on:
  push:
    branches:
      - validation/m4-general-decision-journey
    paths:
      - ".github/workflows/m4-general-decision-preflight.yml"

permissions:
  contents: read

jobs:
  live-public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUBJECT_SHA: 8dca14233908988604fcbbf3f1a32e2f0a4b4a16
      SUBJECT_TREE: 6d7962927b6af47d75a74818f1d116a8c819664c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8dca14233908988604fcbbf3f1a32e2f0a4b4a16
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify exact candidate and configured credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
          test -n "${GROQ_API_KEY:-}"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Public live ordinary-decision proof
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          import { createRuntimeApp } from './dist/src/runtime-app.js';
          import { resolveRuntimeConfig } from './dist/src/runtime-config.js';
          import { createConfiguredSolandraCognition } from './dist/src/solandra/cognition-composition.js';

          const PUBLIC_DEVELOPMENT_PROBE = "I’m choosing between naming a private scratch folder ‘Workbench’ or ‘Later’. I prefer the shorter, quieter label. Help me choose based only on that preference.";
          const config = resolveRuntimeConfig({
            ...process.env,
            LATTICE_DEPLOYMENT_MODE: 'development',
            LATTICE_TRUTH_MODE: 'v36-offline',
            LATTICE_AUTHENTICATION_MODE: 'development-fixture',
            LATTICE_DEVELOPMENT_FIXTURE_SUBJECT_ID: 'm4-public-live-user',
            LATTICE_SOLANDRA_COGNITION_ROUTE: 'groq-gpt-oss-120b',
          });
          const solandra = createConfiguredSolandraCognition(config);
          assert.ok(solandra);
          const app = await createRuntimeApp(config, {
            memoryDispatchDelayMs: 1,
            solandraCognition: solandra.cognition,
            solandraAdvisory: solandra.advisory,
            solandraActionPreparer: solandra.actionPreparer,
            solandraKnowledgePresenter: solandra.knowledgePresenter,
          });
          try {
            const created = await app.inject({ method: 'POST', url: '/api/v1/conversations' });
            assert.equal(created.statusCode, 201, created.body);
            const conversationId = created.json().conversation.id;
            const response = await app.inject({
              method: 'POST',
              url: `/api/v1/conversations/${conversationId}/turns`,
              payload: { turnId: randomUUID(), message: PUBLIC_DEVELOPMENT_PROBE },
            });
            assert.equal(response.statusCode, 200, response.body);
            const body = response.json();
            assert.equal(body.status, 'RECOMMENDATION_ESTABLISHED');
            assert.equal(body.interpretation?.requestedHelp, 'DECISION');
            assert.equal(body.recommendationReference?.selectionAuthorized, false);
            assert.ok(Array.isArray(body.recommendationReference?.options) && body.recommendationReference.options.length >= 2);
            assert.ok(typeof body.presentation?.assistantMessage === 'string' && body.presentation.assistantMessage.trim().length > 0);
            const continuity = (await app.inject({ method: 'GET', url: `/api/v1/conversations/${conversationId}/continuity` })).json();
            assert.equal(continuity.runs.length, 0);
            assert.equal(continuity.knowledge.length, 0);
            assert.equal(continuity.recommendations.length, 1);
            assert.equal(continuity.recommendations[0].selectionAuthorized, false);
            assert.equal(continuity.acceptedChoices.length, 0);
            console.log(JSON.stringify({
              publicDevelopmentProbe: PUBLIC_DEVELOPMENT_PROBE,
              requestedHelp: body.interpretation.requestedHelp,
              recommendationId: body.recommendationReference.recommendationId,
              optionCount: body.recommendationReference.options.length,
              runCount: continuity.runs.length,
              knowledgeCount: continuity.knowledge.length,
              selectionAuthorized: false,
            }));
            console.log('LATTICE_M4_PUBLIC_LIVE_DECISION=PASS');
          } finally {
            await app.close();
          }
          NODE
      - name: Verify exact candidate unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SUBJECT_TREE"
