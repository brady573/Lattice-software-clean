name: Validation — PR 92 Sparse Historical Product Proof

on:
  push:
    branches:
      - validation/pr92-sparse-presentation-20260913
    paths:
      - .github/workflows/pr92-sparse-historical-product-proof.yml
      - tools/pr92-sparse-historical-product-proof.mjs
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_PRODUCT_SHA: 179f83497f0fb8b2d91d93076d024c185729e0b9
  EXPECTED_PRODUCT_TREE: bdc10be9f8a8cabd892c3d825b2aa5ec5d19ff8b

jobs:
  targeted-product-proof:
    name: Sparse history and fresh Knowledge evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout validation infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: validation/pr92-sparse-presentation-20260913
          path: validation-infrastructure
          persist-credentials: false
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - name: Verify exact Product candidate
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          echo "EXACT_CANDIDATE=VERIFIED"
      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install and build exact Product
        working-directory: product
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Stage validation-only proof helper
        shell: bash
        run: |
          set -euo pipefail
          cp validation-infrastructure/tools/pr92-sparse-historical-product-proof.mjs \
            product/tools/pr92-sparse-historical-product-proof.mjs
      - name: Run bounded targeted Product proof
        working-directory: product
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VALIDATION_ARTIFACT_DIR: ../artifacts/pr92-sparse-presentation
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}"
          echo "GROQ_API_KEY=CONFIGURED_NOT_EXPOSED"
          node tools/pr92-sparse-historical-product-proof.mjs
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "PRODUCT_CANDIDATE_REMAINS_UNCHANGED=YES"
          echo "DEPLOYMENT=NOT_PERFORMED"
      - name: Upload bounded Steward evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr92-sparse-historical-product-evidence
          path: artifacts/pr92-sparse-presentation/
          if-no-files-found: warn
          retention-days: 14
