name: RND — Local Model A/B Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-model-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Qwen3.5-9B vs Qwen3-14B on Windows
    runs-on: [self-hosted, Windows, X64, lattice-windows]
    timeout-minutes: 180

    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout exact benchmark revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate harness revision
        env:
          SUBJECT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = git rev-parse HEAD
          Write-Host "BENCHMARK_SOURCE_SHA=$env:SUBJECT_SOURCE_SHA"
          Write-Host "ACTUAL_SOURCE_SHA=$actual"
          if ($actual -ne $env:SUBJECT_SOURCE_SHA) {
            throw "SOURCE_PROVENANCE_FAILURE: checkout does not match benchmark subject."
          }
          npm ci --no-audit --no-fund
          node --check tools/local-model-ab-benchmark.mjs
          node --import tsx --test test/local-model-ab-benchmark.test.ts

      - name: Provision pinned llama.cpp and capture execution environment
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force .local-bench | Out-Null

          $release = "b10621"
          $runtimeDir = Join-Path $env:RUNNER_TEMP "llama-$release-cuda124"
          $downloadDir = Join-Path $env:RUNNER_TEMP "llama-$release-downloads"
          Remove-Item -Recurse -Force $runtimeDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $downloadDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $runtimeDir, $downloadDir | Out-Null

          $mainZip = Join-Path $downloadDir "llama-b10621-bin-win-cuda-12.4-x64.zip"
          $cudaZip = Join-Path $downloadDir "cudart-llama-bin-win-cuda-12.4-x64.zip"
          $mainUrl = "https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-win-cuda-12.4-x64.zip"
          $cudaUrl = "https://github.com/ggml-org/llama.cpp/releases/download/b10621/cudart-llama-bin-win-cuda-12.4-x64.zip"
          $mainSha = "81c2ff62e14b549cd5c766ccdd5c61f09e821a171655c3047bdccfddc2d1a1e2"
          $cudaSha = "8c79a9b226de4b3cacfd1f83d24f962d0773be79f1e7b75c6af4ded7e32ae1d6"

          Invoke-WebRequest -UseBasicParsing -Uri $mainUrl -OutFile $mainZip
          Invoke-WebRequest -UseBasicParsing -Uri $cudaUrl -OutFile $cudaZip
          $actualMainSha = (Get-FileHash $mainZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualCudaSha = (Get-FileHash $cudaZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualMainSha -ne $mainSha) { throw "LLAMA_RUNTIME_INTEGRITY_FAILURE: main binary archive SHA-256 mismatch." }
          if ($actualCudaSha -ne $cudaSha) { throw "LLAMA_RUNTIME_INTEGRITY_FAILURE: CUDA runtime archive SHA-256 mismatch." }

          Expand-Archive -Path $mainZip -DestinationPath $runtimeDir -Force
          Expand-Archive -Path $cudaZip -DestinationPath $runtimeDir -Force
          $server = Get-ChildItem $runtimeDir -Recurse -File -Filter "llama-server.exe" | Select-Object -First 1
          if ($null -eq $server) { throw "LLAMA_RUNTIME_FAILURE: pinned archive did not contain llama-server.exe." }

          [pscustomobject]@{
            path = $server.FullName
            mode = "server"
            source = "ggml-org/llama.cpp@$release"
            mainArchiveSha256 = $actualMainSha
            cudaArchiveSha256 = $actualCudaSha
          } | ConvertTo-Json | Set-Content -Encoding UTF8 .local-bench/llama-launch.json

          @(
            "BENCHMARK_SOURCE_SHA=$(git rev-parse HEAD)"
            "RUNNER_OS=$env:RUNNER_OS"
            "RUNNER_ARCH=$env:RUNNER_ARCH"
            "NODE_VERSION=$(node --version)"
            "NPM_VERSION=$(npm --version)"
            "LLAMA_RELEASE=$release"
            "LLAMA_EXECUTABLE=$($server.FullName)"
            "LLAMA_MAIN_ARCHIVE_SHA256=$actualMainSha"
            "LLAMA_CUDART_ARCHIVE_SHA256=$actualCudaSha"
          ) | Set-Content -Encoding UTF8 .local-bench/environment.txt

          $versionStdout = Join-Path $env:RUNNER_TEMP "llama-version.stdout.txt"
          $versionStderr = Join-Path $env:RUNNER_TEMP "llama-version.stderr.txt"
          $versionProcess = Start-Process -FilePath $server.FullName -ArgumentList @("--version") -Wait -PassThru -RedirectStandardOutput $versionStdout -RedirectStandardError $versionStderr
          $versionLines = @()
          if (Test-Path $versionStdout) { $versionLines += Get-Content $versionStdout }
          if (Test-Path $versionStderr) { $versionLines += Get-Content $versionStderr }
          $versionLines | Set-Content -Encoding UTF8 .local-bench/llama-version.txt
          $versionLines | ForEach-Object { Write-Host $_ }
          if ($versionProcess.ExitCode -ne 0) { throw "LLAMA_RUNTIME_FAILURE: llama-server --version exited $($versionProcess.ExitCode)." }

          nvidia-smi 2>&1 | Tee-Object -FilePath .local-bench/nvidia-smi-before.txt
          $port = Get-NetTCPConnection -LocalPort 8081 -State Listen -ErrorAction SilentlyContinue
          if ($null -ne $port) {
            throw "EXECUTION_SURFACE_FAILURE: port 8081 is already in use; refusing to stop an unrelated process."
          }

      - name: Acquire pinned model artifacts
        run: |
          $ErrorActionPreference = "Stop"
          $runnerRoot = Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $cacheRoot = Join-Path $runnerRoot "_model-cache\lattice-local-model-ab"
          New-Item -ItemType Directory -Force $cacheRoot | Out-Null

          $specs = @(
            [pscustomobject]@{
              alias = "qwen35-9b-q6k"
              repository = "Ciel0HF/Qwen3.5-9B-GGUF"
              revision = "faf76d9c56883a1ebdd2346e8025f591cf7cb544"
              file = "Qwen3.5-9B-Q6_K.gguf"
              url = "https://huggingface.co/Ciel0HF/Qwen3.5-9B-GGUF/resolve/faf76d9c56883a1ebdd2346e8025f591cf7cb544/Qwen3.5-9B-Q6_K.gguf?download=true"
              sha256 = "3000f1b36c1c4cf623372d18a5c47adea3a302e8561e5e7e78eb7a872cc8c804"
              minimumBytes = [int64]7000000000
            },
            [pscustomobject]@{
              alias = "qwen3-14b-q5km"
              repository = "Qwen/Qwen3-14B-GGUF"
              revision = "c75e7b2d0234068f674a1bacf548ea32e27ccd29"
              file = "Qwen3-14B-Q5_K_M.gguf"
              url = "https://huggingface.co/Qwen/Qwen3-14B-GGUF/resolve/c75e7b2d0234068f674a1bacf548ea32e27ccd29/Qwen3-14B-Q5_K_M.gguf?download=true"
              sha256 = "e7c9aba1129ca2936be9eca01419d9f86af40e08caa01230d5574b34d08e3e31"
              minimumBytes = [int64]10000000000
            }
          )

          function Ensure-ModelArtifact($Spec) {
            $path = Join-Path $cacheRoot $Spec.file
            if (Test-Path $path) {
              Write-Host "MODEL_CACHE_VERIFY alias=$($Spec.alias) path=$path"
              $existingSha = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($existingSha -eq $Spec.sha256) {
                $item = Get-Item $path
                Write-Host "MODEL_CACHE_HIT alias=$($Spec.alias) bytes=$($item.Length) sha256=$existingSha"
                return [pscustomobject]@{
                  alias = $Spec.alias
                  repository = $Spec.repository
                  revision = $Spec.revision
                  file = $Spec.file
                  path = $path
                  bytes = [int64]$item.Length
                  sha256 = $existingSha
                  cacheHit = $true
                }
              }
              Write-Host "MODEL_CACHE_HASH_MISMATCH alias=$($Spec.alias) expected=$($Spec.sha256) actual=$existingSha; removing invalid cache entry"
              Remove-Item -Force $path
            }

            $driveName = [IO.Path]::GetPathRoot($cacheRoot).Substring(0, 1)
            $drive = Get-PSDrive -Name $driveName
            $requiredFree = [int64]$Spec.minimumBytes + [int64](5GB)
            if ([int64]$drive.Free -lt $requiredFree) {
              throw "MODEL_CACHE_SPACE_FAILURE: alias=$($Spec.alias) free=$($drive.Free) requiredMinimum=$requiredFree cacheRoot=$cacheRoot"
            }

            $partial = "$path.partial"
            $curl = Get-Command curl.exe -ErrorAction SilentlyContinue
            if ($null -ne $curl) {
              Write-Host "MODEL_DOWNLOAD_START alias=$($Spec.alias) source=$($Spec.repository)@$($Spec.revision) target=$path"
              & $curl.Source --location --fail --retry 4 --retry-delay 5 --retry-all-errors --continue-at - --output $partial $Spec.url
              if ($LASTEXITCODE -ne 0) {
                throw "MODEL_DOWNLOAD_FAILURE: alias=$($Spec.alias) curlExit=$LASTEXITCODE"
              }
            } else {
              Remove-Item -Force $partial -ErrorAction SilentlyContinue
              Write-Host "MODEL_DOWNLOAD_START alias=$($Spec.alias) source=$($Spec.repository)@$($Spec.revision) target=$path transport=Invoke-WebRequest"
              Invoke-WebRequest -UseBasicParsing -Uri $Spec.url -OutFile $partial
            }

            $actualSha = (Get-FileHash $partial -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha -ne $Spec.sha256) {
              Remove-Item -Force $partial -ErrorAction SilentlyContinue
              throw "MODEL_INTEGRITY_FAILURE: alias=$($Spec.alias) expected=$($Spec.sha256) actual=$actualSha"
            }
            Move-Item -Force $partial $path
            $item = Get-Item $path
            Write-Host "MODEL_DOWNLOAD_VERIFIED alias=$($Spec.alias) bytes=$($item.Length) sha256=$actualSha"
            return [pscustomobject]@{
              alias = $Spec.alias
              repository = $Spec.repository
              revision = $Spec.revision
              file = $Spec.file
              path = $path
              bytes = [int64]$item.Length
              sha256 = $actualSha
              cacheHit = $false
            }
          }

          $models = @()
          foreach ($spec in $specs) {
            $models += Ensure-ModelArtifact $spec
          }

          [pscustomobject]@{
            cacheRoot = $cacheRoot
            acquiredAt = (Get-Date).ToUniversalTime().ToString("o")
            models = $models
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 .local-bench/model-artifacts.json
          Get-Content .local-bench/model-artifacts.json

      - name: Run matched local model comparison
        run: |
          $ErrorActionPreference = "Stop"
          $launch = Get-Content .local-bench/llama-launch.json -Raw | ConvertFrom-Json
          $llama = [string]$launch.path
          $artifactSet = Get-Content .local-bench/model-artifacts.json -Raw | ConvertFrom-Json

          function Get-ModelPath([string]$Alias) {
            $match = @($artifactSet.models | Where-Object { $_.alias -eq $Alias })
            if ($match.Count -ne 1) { throw "MODEL_ARTIFACT_LOOKUP_FAILURE: expected one artifact for $Alias, got $($match.Count)." }
            return [string]$match[0].path
          }

          function Show-ServerTail([string]$Stdout, [string]$Stderr) {
            if (Test-Path $Stdout) {
              Write-Host "SERVER_STDOUT_TAIL_BEGIN"
              Get-Content $Stdout -Tail 40 | ForEach-Object { Write-Host $_ }
              Write-Host "SERVER_STDOUT_TAIL_END"
            }
            if (Test-Path $Stderr) {
              Write-Host "SERVER_STDERR_TAIL_BEGIN"
              Get-Content $Stderr -Tail 80 | ForEach-Object { Write-Host $_ }
              Write-Host "SERVER_STDERR_TAIL_END"
            }
          }

          function Wait-ModelHealth(
            [int]$Port,
            [System.Diagnostics.Process]$Process,
            [string]$Stdout,
            [string]$Stderr,
            [int]$TimeoutSeconds = 300
          ) {
            $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
            do {
              if ($Process.HasExited) {
                Show-ServerTail -Stdout $Stdout -Stderr $Stderr
                throw "MODEL_START_FAILURE: llama.cpp server exited before health readiness with code $($Process.ExitCode)."
              }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$Port/health" -TimeoutSec 5
                if ($null -ne $health) { return }
              } catch {
                Start-Sleep -Seconds 2
              }
            } while ((Get-Date) -lt $deadline)
            Show-ServerTail -Stdout $Stdout -Stderr $Stderr
            throw "MODEL_START_TIMEOUT: local llama.cpp server did not become healthy on port $Port within $TimeoutSeconds seconds."
          }

          function Invoke-ModelBenchmark(
            [string]$ModelPath,
            [string]$Alias,
            [string]$Label,
            [string]$Output
          ) {
            $stdout = ".local-bench/$Alias-server.stdout.log"
            $stderr = ".local-bench/$Alias-server.stderr.log"
            $args = @(
              "-m", $ModelPath,
              "--alias", $Alias,
              "--host", "127.0.0.1",
              "--port", "8081",
              "--ctx-size", "16384",
              "-ngl", "99"
            )
            Write-Host "START_MODEL alias=$Alias modelPath=$ModelPath ctx=16384 port=8081 executable=$llama"
            $process = Start-Process -FilePath $llama -ArgumentList $args -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            try {
              Wait-ModelHealth -Port 8081 -Process $process -Stdout $stdout -Stderr $stderr
              Invoke-RestMethod "http://127.0.0.1:8081/v1/models" | ConvertTo-Json -Depth 8 |
                Set-Content -Encoding UTF8 ".local-bench/$Alias-models.json"
              node tools/local-model-ab-benchmark.mjs run `
                --base-url http://127.0.0.1:8081/v1 `
                --model $Alias `
                --label $Label `
                --repeat 3 `
                --timeout-ms 120000 `
                --output $Output
              if ($LASTEXITCODE -ne 0) {
                Show-ServerTail -Stdout $stdout -Stderr $stderr
                throw "BENCHMARK_RUN_FAILURE: $Alias exited $LASTEXITCODE"
              }
            } finally {
              if (!$process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds 3
            }
          }

          Invoke-ModelBenchmark `
            -ModelPath (Get-ModelPath "qwen35-9b-q6k") `
            -Alias "qwen35-9b-q6k" `
            -Label "Qwen3.5-9B Q6_K | ctx=16384" `
            -Output ".local-bench/qwen35-9b-q6k.json"

          nvidia-smi 2>&1 | Tee-Object -FilePath .local-bench/nvidia-smi-between.txt

          Invoke-ModelBenchmark `
            -ModelPath (Get-ModelPath "qwen3-14b-q5km") `
            -Alias "qwen3-14b-q5km" `
            -Label "Qwen3-14B Q5_K_M | ctx=16384" `
            -Output ".local-bench/qwen3-14b-q5km.json"

          node tools/local-model-ab-benchmark.mjs compare `
            --left .local-bench/qwen35-9b-q6k.json `
            --right .local-bench/qwen3-14b-q5km.json |
            Set-Content -Encoding UTF8 .local-bench/comparison.json

          nvidia-smi 2>&1 | Tee-Object -FilePath .local-bench/nvidia-smi-after.txt
          Get-ChildItem .local-bench -File |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)"
            } |
            Set-Content -Encoding UTF8 .local-bench/artifact-sha256.txt
          Get-Content .local-bench/comparison.json

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-model-ab-${{ github.event.pull_request.head.sha || github.sha }}
          path: .local-bench/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
