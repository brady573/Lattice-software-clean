name: Validation — Deployed Solandra Functional

on:
  workflow_dispatch:
    inputs:
      product_target:
        description: Approved Render validator Product origin
        required: true
        default: https://lattice-solandra-validation.onrender.com
        type: string
      run_owner_auth:
        description: Also run Owner-auth validation against the canonical Owner deployment
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deployed-solandra-functional-validation
  cancel-in-progress: false

jobs:
  deployed-functional:
    name: Deployed Solandra functional validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate approved Product target
        shell: bash
        env:
          REQUESTED_PRODUCT_TARGET: ${{ inputs.product_target }}
        run: |
          set -euo pipefail
          target="${REQUESTED_PRODUCT_TARGET%/}"
          if [[ "$target" == "https://lattice-solandra-validation.onrender.com" ]]; then
            kind=canonical-validator
          elif [[ "$target" =~ ^https://lattice-solandra-validation-pr-[1-9][0-9]*\.onrender\.com$ ]]; then
            kind=validator-pr-preview
          else
            echo 'PRODUCT_TARGET=REJECTED'
            exit 1
          fi
          printf 'PRODUCT_VALIDATION_BASE_URL=%s\n' "$target" >> "$GITHUB_ENV"
          printf 'PRODUCT_VALIDATION_TARGET_KIND=%s\n' "$kind" >> "$GITHUB_ENV"
          echo "PRODUCT_TARGET=APPROVED kind=$kind target=$target"

      - name: Provision Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.13'

      - name: Verify owner secret is configured
        if: ${{ inputs.run_owner_auth }}
        shell: bash
        env:
          LATTICE_OWNER_ACCESS_TOKEN: ${{ secrets.LATTICE_OWNER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${LATTICE_OWNER_ACCESS_TOKEN:-}"
          echo 'OWNER_ACCESS_SECRET=CONFIGURED'

      - name: Install deployed validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            'pytest==9.0.2' \
            'playwright==1.58.0' \
            'pytest-playwright==0.7.2'
          python -m playwright install --with-deps chromium

      - name: Run deployed owner-auth functional validation
        if: ${{ inputs.run_owner_auth }}
        env:
          PYTHONUNBUFFERED: '1'
          DEPLOYED_BASE_URL: https://lattice-solandra.onrender.com
          LATTICE_OWNER_ACCESS_TOKEN: ${{ secrets.LATTICE_OWNER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python -m pytest -q tools/deployed_owner_auth_validation.py \
            --browser chromium \
            --tracing off \
            --screenshot off \
            --video off

      - name: Run deployed Product journey validation
        env:
          PYTHONUNBUFFERED: '1'
          DEPLOYED_BASE_URL: ${{ env.PRODUCT_VALIDATION_BASE_URL }}
        run: |
          set -euo pipefail
          test -z "${LATTICE_OWNER_ACCESS_TOKEN+x}"
          python -m pytest -q -s tools/deployed_product_journey_validation.py \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --video retain-on-failure

      - name: Upload failed Product journey artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-product-journey-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Record validation scope
        if: always()
        run: |
          echo 'OWNER_AUTH_TARGET=https://lattice-solandra.onrender.com/'
          echo "OWNER_AUTH_ENABLED=${{ inputs.run_owner_auth }}"
          echo "PRODUCT_JOURNEY_TARGET=${PRODUCT_VALIDATION_BASE_URL}/"
          echo "PRODUCT_JOURNEY_TARGET_KIND=${PRODUCT_VALIDATION_TARGET_KIND}"
          echo 'SECRET_OUTPUT=PROHIBITED'
          echo 'OWNER_CREDENTIAL_SCOPE=OWNER_AUTH_ONLY'
          echo 'VALIDATION_SCOPE=OPTIONAL_OWNER_AUTH_PLUS_PRODUCT_JOURNEY'
