name: Validation — Deployed Solandra Functional

on:
  workflow_dispatch:
    inputs:
      heldout_cases_json:
        description: 'Optional validator-selected black-box case bundle (JSON, version 1)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deployed-solandra-functional-validation
  cancel-in-progress: false

jobs:
  deployed-functional:
    name: Deployed Solandra functional validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOYED_BASE_URL: https://lattice-solandra.onrender.com
      LATTICE_OWNER_ACCESS_TOKEN: ${{ secrets.LATTICE_OWNER_ACCESS_TOKEN }}

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.13'

      - name: Verify owner secret is configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LATTICE_OWNER_ACCESS_TOKEN:-}"
          echo 'OWNER_ACCESS_SECRET=CONFIGURED'

      - name: Install deployed validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            'pytest==9.0.2' \
            'playwright==1.58.0' \
            'pytest-playwright==0.7.2'
          python -m playwright install --with-deps chromium

      - name: Run deployed owner-auth functional validation
        id: owner_auth
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python -m pytest -q tools/deployed_owner_auth_validation.py \
            --browser chromium \
            --tracing off \
            --screenshot off \
            --video off

      - name: Run deployed Product journey validation
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python -m pytest -q -s tools/deployed_product_journey_validation.py \
            --browser chromium \
            --tracing off \
            --screenshot off \
            --video off

      - name: Run validator-selected held-out Product cases
        if: ${{ always() && !cancelled() && inputs.heldout_cases_json != '' && steps.owner_auth.outcome == 'success' }}
        env:
          PYTHONUNBUFFERED: '1'
          HELDOUT_CASES_JSON: ${{ inputs.heldout_cases_json }}
          HELDOUT_ARTIFACT_DIR: artifacts/deployed-heldout
        run: |
          set -euo pipefail
          python -m pytest -q -s tools/deployed_heldout_validation.py \
            --browser chromium \
            --tracing off \
            --screenshot off \
            --video off

      - name: Upload held-out black-box evidence
        if: ${{ always() && inputs.heldout_cases_json != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-heldout-black-box-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deployed-heldout/
          if-no-files-found: warn
          retention-days: 7

      - name: Record validation scope
        if: always()
        run: |
          echo 'DEPLOYED_TARGET=https://lattice-solandra.onrender.com/'
          echo 'SECRET_OUTPUT=PROHIBITED'
          echo 'PRODUCTION_MUTATION=CONVERSATION_TEST_DATA_ONLY'
          echo 'VALIDATION_SCOPE=OWNER_AUTH_PLUS_PRODUCT_JOURNEYS_PLUS_OPTIONAL_HELDOUT_BLACK_BOX'
