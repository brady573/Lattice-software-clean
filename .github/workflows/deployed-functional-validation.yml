name: Validation — Deployed Solandra Owner Auth

on:
  push:
    branches:
      - validation/deployed-owner-auth
    paths:
      - "tools/deployed_owner_auth_validation.py"
      - ".github/workflows/deployed-functional-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployed-solandra-functional-validation
  cancel-in-progress: false

jobs:
  deployed-owner-auth:
    name: Deployed owner-auth validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYED_BASE_URL: https://lattice-solandra.onrender.com
      LATTICE_OWNER_ACCESS_TOKEN: ${{ secrets.LATTICE_OWNER_ACCESS_TOKEN }}

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.13'

      - name: Verify owner secret is configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LATTICE_OWNER_ACCESS_TOKEN:-}"
          echo 'OWNER_ACCESS_SECRET=CONFIGURED'

      - name: Install deployed validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            'pytest==9.0.2' \
            'playwright==1.58.0' \
            'pytest-playwright==0.7.2'
          python -m playwright install --with-deps chromium

      - name: Run deployed owner-auth functional validation
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python -m pytest -q tools/deployed_owner_auth_validation.py \
            --browser chromium \
            --tracing off \
            --screenshot off \
            --video off

      - name: Record validation scope
        if: always()
        run: |
          echo 'DEPLOYED_TARGET=https://lattice-solandra.onrender.com/'
          echo 'SECRET_OUTPUT=PROHIBITED'
          echo 'PRODUCTION_MUTATION=NONE'
          echo 'VALIDATION_SCOPE=OWNER_AUTHENTICATION'
