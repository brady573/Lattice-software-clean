name: Validation — Deployed Solandra Functional

on:
  workflow_dispatch:
    inputs:
      product_target:
        description: Approved Render validator Product origin
        required: true
        default: https://lattice-solandra-validation.onrender.com
        type: string
      run_owner_auth:
        description: Also run Owner-auth validation against the canonical Owner deployment
        required: true
        default: true
        type: boolean
      validation_profile:
        description: User-facing Product validation profile
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - historical-canaries
      historical_cases_json:
        description: JSON cases for the manual historical-canaries profile
        required: false
        default: ''
        type: string
      validator_deploy_id_before:
        description: Optional externally verified canonical validator deploy ID immediately before the run
        required: false
        default: ''
        type: string
  deployment_status:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deployed-solandra-functional-${{ github.event_name == 'deployment_status' && github.event.deployment_status.environment_url || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'deployment_status' }}

jobs:
  deployed-functional:
    name: Deployed Solandra functional validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Provision Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.13'

      - name: Resolve validation request
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANUAL_PRODUCT_TARGET: ${{ inputs.product_target }}
          MANUAL_RUN_OWNER_AUTH: ${{ inputs.run_owner_auth }}
          MANUAL_VALIDATION_PROFILE: ${{ inputs.validation_profile }}
          MANUAL_HISTORICAL_CASES_JSON: ${{ inputs.historical_cases_json }}
        run: |
          set -euo pipefail
          python -m tools.deployed_validation_event

      - name: Record ineligible automatic deployment
        if: ${{ github.event_name == 'deployment_status' && steps.resolve.outputs.should_run != 'true' }}
        shell: bash
        run: |
          echo "PRODUCT_VALIDATION=SKIPPED reason=${{ steps.resolve.outputs.skip_reason }}"

      - name: Initialize historical canary evidence
        if: ${{ github.event_name == 'workflow_dispatch' && steps.resolve.outputs.should_run == 'true' && steps.resolve.outputs.validation_profile == 'historical-canaries' }}
        env:
          DEPLOYED_BASE_URL: ${{ steps.resolve.outputs.product_target }}
          EXPECTED_PRODUCT_SHA: 6ef1d7ab6110cec0197fc93fb7c71ac17c6902a6
          HISTORICAL_CASES_JSON: ${{ inputs.historical_cases_json }}
          VALIDATOR_DEPLOY_ID_BEFORE: ${{ inputs.validator_deploy_id_before }}
        run: |
          set -euo pipefail
          test -z "${LATTICE_OWNER_ACCESS_TOKEN+x}"
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import subprocess

          cases = json.loads(os.environ["HISTORICAL_CASES_JSON"])
          path = Path("test-results/historical-canaries/evidence.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          workflow_url = (
              f"{os.environ.get('GITHUB_SERVER_URL', '')}/{os.environ.get('GITHUB_REPOSITORY', '')}"
              f"/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          )
          payload = {
              "schemaVersion": 1,
              "evidenceKind": "historical-user-facing-canaries",
              "startedAt": datetime.now(timezone.utc).isoformat(),
              "completedAt": None,
              "observationStatus": "BLOCKED",
              "harnessBlocker": "Product journey did not start or did not overwrite bootstrap evidence.",
              "validatorHarness": {
                  "branch": os.environ.get("GITHUB_REF_NAME") or None,
                  "sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                  "workflowRunId": os.environ.get("GITHUB_RUN_ID") or None,
                  "workflowUrl": workflow_url,
              },
              "canonicalProductTarget": os.environ["DEPLOYED_BASE_URL"],
              "expectedProductSha": os.environ["EXPECTED_PRODUCT_SHA"],
              "deployment": {
                  "idBefore": os.environ.get("VALIDATOR_DEPLOY_ID_BEFORE") or None,
                  "idAfter": None,
                  "observationState": "KNOWN" if os.environ.get("VALIDATOR_DEPLOY_ID_BEFORE") else "UNKNOWN",
              },
              "ownerCredentialPresent": "LATTICE_OWNER_ACCESS_TOKEN" in os.environ,
              "casesAsExecuted": cases,
              "cases": {
                  case_id: {"status": "NOT_REACHED", "reason": "Product journey did not start."}
                  for case_id in ("19", "20", "44", "47")
              },
              "providerModelObservation": {"state": "UNKNOWN", "values": []},
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Install deployed validation dependencies
        if: ${{ steps.resolve.outputs.should_run == 'true' }}
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            'pytest==9.0.2' \
            'playwright==1.58.0' \
            'pytest-playwright==0.7.2'
          python -m playwright install --with-deps chromium

      - name: Run deployed Product validator regressions
        if: ${{ steps.resolve.outputs.should_run == 'true' }}
        run: |
          python -m pytest -q \
            tools/test_deployed_product_journey_validation.py \
            tools/test_deployed_validation_event.py \
            tools/test_deployed_historical_canary_validation.py

      - name: Verify owner secret is configured
        if: ${{ github.event_name == 'workflow_dispatch' && steps.resolve.outputs.owner_auth_enabled == 'true' }}
        shell: bash
        env:
          LATTICE_OWNER_ACCESS_TOKEN: ${{ secrets.LATTICE_OWNER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${LATTICE_OWNER_ACCESS_TOKEN:-}"
          echo 'OWNER_ACCESS_SECRET=CONFIGURED'

      - name: Run deployed owner-auth functional validation
        if: ${{ github.event_name == 'workflow_dispatch' && steps.resolve.outputs.owner_auth_enabled == 'true' }}
        env:
          PYTHONUNBUFFERED: '1'
          DEPLOYED_BASE_URL: https://lattice-solandra.onrender.com
          LATTICE_OWNER_ACCESS_TOKEN: ${{ secrets.LATTICE_OWNER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python -m pytest -q tools/deployed_owner_auth_validation.py \
            --browser chromium \
            --tracing off \
            --screenshot off \
            --video off

      - name: Revalidate automatic preview revision
        id: freshness
        if: ${{ github.event_name == 'deployment_status' && steps.resolve.outputs.should_run == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.deployed_validation_event

      - name: Record superseded automatic deployment
        if: ${{ github.event_name == 'deployment_status' && steps.resolve.outputs.should_run == 'true' && steps.freshness.outputs.should_run != 'true' }}
        shell: bash
        run: |
          echo "PRODUCT_VALIDATION=SKIPPED reason=${{ steps.freshness.outputs.skip_reason }}"

      - name: Run deployed Product journey validation
        id: product-journey
        if: ${{ steps.resolve.outputs.should_run == 'true' && steps.resolve.outputs.validation_profile == 'baseline' && (github.event_name != 'deployment_status' || steps.freshness.outputs.should_run == 'true') }}
        env:
          PYTHONUNBUFFERED: '1'
          DEPLOYED_BASE_URL: ${{ steps.resolve.outputs.product_target }}
        run: |
          set -euo pipefail
          test -z "${LATTICE_OWNER_ACCESS_TOKEN+x}"
          python -m pytest -q -s tools/deployed_product_journey_validation.py \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --video retain-on-failure

      - name: Upload failed Product journey artifacts
        if: ${{ failure() && steps.product-journey.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-product-journey-${{ steps.resolve.outputs.expected_sha || github.workflow_sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Run historical user-facing canaries
        id: historical-canaries
        if: ${{ github.event_name == 'workflow_dispatch' && steps.resolve.outputs.should_run == 'true' && steps.resolve.outputs.validation_profile == 'historical-canaries' }}
        env:
          PYTHONUNBUFFERED: '1'
          DEPLOYED_BASE_URL: ${{ steps.resolve.outputs.product_target }}
          EXPECTED_PRODUCT_SHA: 6ef1d7ab6110cec0197fc93fb7c71ac17c6902a6
          HISTORICAL_CASES_JSON: ${{ inputs.historical_cases_json }}
          VALIDATOR_DEPLOY_ID_BEFORE: ${{ inputs.validator_deploy_id_before }}
        run: |
          set -euo pipefail
          test -z "${LATTICE_OWNER_ACCESS_TOKEN+x}"
          python -m pytest -q -s tools/deployed_historical_canary_validation.py \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot off \
            --video retain-on-failure

      - name: Upload historical canary evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && steps.resolve.outputs.should_run == 'true' && steps.resolve.outputs.validation_profile == 'historical-canaries' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-canaries-${{ github.run_id }}
          path: test-results/historical-canaries/
          if-no-files-found: error
          retention-days: 14

      - name: Record validation scope
        if: always()
        run: |
          echo 'OWNER_AUTH_TARGET=https://lattice-solandra.onrender.com/'
          echo "OWNER_AUTH_ENABLED=${{ steps.resolve.outputs.owner_auth_enabled || 'false' }}"
          echo "PRODUCT_JOURNEY_TARGET=${{ steps.resolve.outputs.product_target }}"
          echo "PRODUCT_JOURNEY_TARGET_KIND=${{ steps.resolve.outputs.target_kind }}"
          echo "PRODUCT_EXPECTED_DEPLOYED_SHA=${{ steps.resolve.outputs.expected_sha }}"
          echo "PRODUCT_PREVIEW_PR=${{ steps.resolve.outputs.pr_number }}"
          echo "PRODUCT_VALIDATION_REQUESTED=${{ steps.resolve.outputs.should_run || 'false' }}"
          echo "PRODUCT_VALIDATION_SKIP_REASON=${{ steps.freshness.outputs.skip_reason || steps.resolve.outputs.skip_reason }}"
          echo "PRODUCT_VALIDATION_PROFILE=${{ steps.resolve.outputs.validation_profile || 'baseline' }}"
          echo 'SECRET_OUTPUT=PROHIBITED'
          echo 'OWNER_CREDENTIAL_SCOPE=OWNER_AUTH_ONLY'
          echo 'VALIDATION_SCOPE=OPTIONAL_OWNER_AUTH_PLUS_PRODUCT_JOURNEY'
