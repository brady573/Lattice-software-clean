name: Validation — Deployed Solandra Functional
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Deployed Product diagnostic (unbound)' || format('Deployment event qualification — {0}', github.event.deployment_status.state) }}

on:
  workflow_dispatch:
    inputs:
      product_target:
        description: Approved Render validator Product origin
        required: true
        default: https://lattice-solandra-validation.onrender.com
        type: string
      run_owner_auth:
        description: Also run Owner-auth validation against the canonical Owner deployment
        required: true
        default: true
        type: boolean
  deployment_status:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deployed-solandra-functional-${{ github.event_name == 'deployment_status' && github.event.deployment_status.environment_url || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'deployment_status' }}

jobs:
  event_qualification:
    name: Deployment event qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      product_target: ${{ steps.resolve.outputs.product_target }}
      target_kind: ${{ steps.resolve.outputs.target_kind }}
      owner_auth_enabled: ${{ steps.resolve.outputs.owner_auth_enabled }}
      expected_sha: ${{ steps.resolve.outputs.expected_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      evidence_binding: ${{ steps.resolve.outputs.evidence_binding }}

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Provision Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.13'

      - name: Resolve validation request
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANUAL_PRODUCT_TARGET: ${{ inputs.product_target }}
          MANUAL_RUN_OWNER_AUTH: ${{ inputs.run_owner_auth }}
        run: |
          set -euo pipefail
          python tools/deployed_validation_event.py

      - name: Record event qualification
        shell: bash
        run: |
          echo "PRODUCT_VALIDATION_REQUESTED=${{ steps.resolve.outputs.should_run || 'false' }}"
          echo "PRODUCT_EVIDENCE_BINDING=${{ steps.resolve.outputs.evidence_binding || 'NOT_REQUESTED' }}"
          echo "PRODUCT_EXPECTED_DEPLOYED_SHA=${{ steps.resolve.outputs.expected_sha }}"
          if [ "${{ steps.resolve.outputs.should_run }}" != "true" ]; then
            echo "PRODUCT_VALIDATION=SKIPPED_NOT_REQUESTED reason=${{ steps.resolve.outputs.skip_reason }}"
          fi

  deployed-functional:
    name: Deployed Solandra functional validation
    needs: event_qualification
    if: ${{ needs.event_qualification.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Provision Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.13'

      - name: Install deployed validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            'pytest==9.0.2' \
            'playwright==1.58.0' \
            'pytest-playwright==0.7.2'
          python -m playwright install --with-deps chromium

      - name: Run deployed Product validator regressions
        run: |
          python -m pytest -q \
            tools/test_deployed_product_journey_validation.py \
            tools/test_deployed_validation_event.py

      - name: Verify owner secret is configured
        if: ${{ github.event_name == 'workflow_dispatch' && needs.event_qualification.outputs.owner_auth_enabled == 'true' }}
        shell: bash
        env:
          LATTICE_OWNER_ACCESS_TOKEN: ${{ secrets.LATTICE_OWNER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${LATTICE_OWNER_ACCESS_TOKEN:-}"
          echo 'OWNER_ACCESS_SECRET=CONFIGURED'

      - name: Run deployed owner-auth functional validation
        if: ${{ github.event_name == 'workflow_dispatch' && needs.event_qualification.outputs.owner_auth_enabled == 'true' }}
        env:
          PYTHONUNBUFFERED: '1'
          DEPLOYED_BASE_URL: https://lattice-solandra.onrender.com
          LATTICE_OWNER_ACCESS_TOKEN: ${{ secrets.LATTICE_OWNER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python -m pytest -q tools/deployed_owner_auth_validation.py \
            --browser chromium \
            --tracing off \
            --screenshot off \
            --video off

      - name: Revalidate automatic preview revision
        id: freshness
        if: ${{ github.event_name == 'deployment_status' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/deployed_validation_event.py

      - name: Record superseded automatic deployment
        if: ${{ github.event_name == 'deployment_status' && steps.freshness.outputs.should_run != 'true' }}
        shell: bash
        run: |
          echo "PRODUCT_VALIDATION=SKIPPED reason=${{ steps.freshness.outputs.skip_reason }}"

      - name: Run deployed Product journey validation
        id: product-journey
        if: ${{ github.event_name != 'deployment_status' || steps.freshness.outputs.should_run == 'true' }}
        env:
          PYTHONUNBUFFERED: '1'
          DEPLOYED_BASE_URL: ${{ needs.event_qualification.outputs.product_target }}
        run: |
          set -euo pipefail
          test -z "${LATTICE_OWNER_ACCESS_TOKEN+x}"
          python -m pytest -q -s tools/deployed_product_journey_validation.py \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --video retain-on-failure

      - name: Upload failed Product journey artifacts
        if: ${{ failure() && steps.product-journey.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-product-journey-${{ needs.event_qualification.outputs.expected_sha || github.workflow_sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Record validation scope
        if: always()
        run: |
          echo 'OWNER_AUTH_TARGET=https://lattice-solandra.onrender.com/'
          echo "OWNER_AUTH_ENABLED=${{ needs.event_qualification.outputs.owner_auth_enabled || 'false' }}"
          echo "PRODUCT_JOURNEY_TARGET=${{ needs.event_qualification.outputs.product_target }}"
          echo "PRODUCT_JOURNEY_TARGET_KIND=${{ needs.event_qualification.outputs.target_kind }}"
          echo "PRODUCT_EVIDENCE_BINDING=${{ needs.event_qualification.outputs.evidence_binding }}"
          echo "PRODUCT_EXPECTED_DEPLOYED_SHA=${{ needs.event_qualification.outputs.expected_sha }}"
          echo "PRODUCT_PREVIEW_PR=${{ needs.event_qualification.outputs.pr_number }}"
          echo 'PRODUCT_VALIDATION_REQUESTED=true'
          echo "PRODUCT_VALIDATION_SKIP_REASON=${{ steps.freshness.outputs.skip_reason || needs.event_qualification.outputs.skip_reason }}"
          echo 'SECRET_OUTPUT=PROHIBITED'
          echo 'OWNER_CREDENTIAL_SCOPE=OWNER_AUTH_ONLY'
          echo 'VALIDATION_SCOPE=OPTIONAL_OWNER_AUTH_PLUS_PRODUCT_JOURNEY'
