name: Validation — PR126 Deployed Product Journey

on:
  push:
    branches:
      - validation/pr126-deployed-product-journey

permissions:
  contents: read

concurrency:
  group: pr126-deployed-product-journey
  cancel-in-progress: false

jobs:
  product-journey:
    name: PR126 deployed Product journey
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout validation artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact Product parent and validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PRODUCT_SHA='3b01853951d4eb01e1442c61ca6d212db3a0d3dd'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PRODUCT_SHA" HEAD)
          printf 'VALIDATION_CHANGED_FILE=%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/pr126-deployed-product-journey.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'tools/pr126_deployed_product_journey_validation.py'
          echo "PRODUCT_PARENT_SHA=$EXPECTED_PRODUCT_SHA"
          echo 'VALIDATION_ONLY_SCOPE=PASS'

      - name: Provision Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.13'

      - name: Install deployed validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            'pytest==9.0.2' \
            'playwright==1.58.0' \
            'pytest-playwright==0.7.2'
          python -m playwright install --with-deps chromium

      - name: Run accepted unauthenticated Product journey against PR126 preview
        env:
          PYTHONUNBUFFERED: '1'
          DEPLOYED_BASE_URL: https://lattice-solandra-validation-pr-126.onrender.com
        run: |
          set -euo pipefail
          test -z "${LATTICE_OWNER_ACCESS_TOKEN+x}"
          python -m pytest -q -s tools/pr126_deployed_product_journey_validation.py \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --video retain-on-failure

      - name: Upload failed Product journey artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr126-deployed-product-journey-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Record validation scope
        if: always()
        run: |
          echo 'PRODUCT_CANDIDATE=3b01853951d4eb01e1442c61ca6d212db3a0d3dd'
          echo 'PRODUCT_JOURNEY_TARGET=https://lattice-solandra-validation-pr-126.onrender.com/'
          echo 'OWNER_CREDENTIAL=NOT_PROVIDED'
          echo 'EVALUATOR_BASIS=74341afa91c23e5daa28d41cbfc43fc4c3f91dd0'
