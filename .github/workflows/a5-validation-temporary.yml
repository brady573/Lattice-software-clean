name: TEMP — A5 Focused Validation

on:
  push:
    branches:
      - validation/a5-implementation
    paths:
      - ".github/workflows/a5-validation-temporary.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 046863f87080d537b672468c45b4d423c6b424e9
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
