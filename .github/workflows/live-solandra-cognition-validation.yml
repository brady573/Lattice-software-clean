name: CI — Live Solandra Cognition Qualification

on:
  pull_request:
    paths:
      - "src/model/**"
      - "src/solandra/cognition.ts"
      - "src/solandra/cognition-composition.ts"
      - "src/runtime-config.ts"
      - "tools/issue-91-live-solandra-cognition.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/live-solandra-cognition-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/model/**"
      - "src/solandra/cognition.ts"
      - "src/solandra/cognition-composition.ts"
      - "src/runtime-config.ts"
      - "tools/issue-91-live-solandra-cognition.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/live-solandra-cognition-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-groq-openai-gpt-oss-120b
  queue: max

jobs:
  live-solandra-cognition:
    name: Live Solandra cognition qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact subject source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute bounded real-Groq cognition proof
        env:
          SUBJECT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SOURCE_SHA"
          node --import tsx tools/issue-91-live-solandra-cognition.mjs
          git diff --exit-code
          echo "LIVE_SOLANDRA_COGNITION=PASS sha=$SUBJECT_SOURCE_SHA"
          echo 'LIVE_SOLANDRA_COGNITION_EVIDENCE=SPECIALIST_PROVIDER_QUALIFICATION'
          echo 'PRODUCT_ACCEPTANCE=NOT_CLAIMED_BY_LIVE_PROVIDER_LANE'
          echo 'PRODUCTION_DEPLOYMENT=NOT_PERFORMED'
          echo 'PRODUCTION_DATABASE=NOT_TOUCHED'
