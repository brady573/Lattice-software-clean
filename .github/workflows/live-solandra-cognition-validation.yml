name: CI — Live Solandra Cognition

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tools/issue-91-live-solandra-cognition.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/live-solandra-cognition-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-solandra-cognition:
    name: Live model-owned Solandra cognition validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: live-solandra-cognition-groq
      cancel-in-progress: false
    steps:
      - name: Checkout exact subject source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute bounded real-Groq cognition proof
        env:
          SUBJECT_SOURCE_SHA: ${{ github.sha }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SOURCE_SHA"
          node --import tsx tools/issue-91-live-solandra-cognition.mjs
          git diff --exit-code
          echo "LIVE_SOLANDRA_COGNITION=PASS sha=$SUBJECT_SOURCE_SHA"
          echo 'PRODUCTION_DEPLOYMENT=NOT_PERFORMED'
          echo 'PRODUCTION_DATABASE=NOT_TOUCHED'
